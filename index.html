<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}</style>
<title>水田自主トレロード</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="水田自主トレロード">
<meta name="theme-color" content="#0a1430">
<link rel="apple-touch-icon" href="icon.png?v=2">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=M+PLUS+Rounded+1c:wght@400;700;800&display=swap">
<style>
/* レイアウト：ナイターの球場。上に照明の光、まん中に選手カード、下にスコアボード風のタブ */
:root {
  --night: #0a1430;      /* 夜空 */
  --panel: #13214a;      /* 板 */
  --panel2: #1a2c5e;
  --line: #2b3f7a;
  --light: #ffd84a;      /* 照明の黄色 */
  --score: #ff6b3d;      /* スコアボードのオレンジ */
  --turf: #3fd17a;       /* 芝の緑 */
  --ink: #eef2ff;
  --dim: #95a4d0;
  --font-d: "Dela Gothic One", "Hiragino Sans", "Yu Gothic", sans-serif;
  --font-b: "M PLUS Rounded 1c", "Hiragino Maru Gothic ProN", "Hiragino Sans", sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }   /* 演出の黒い幕を、閉じた時にちゃんと消す */
html, body { min-height: 100%; }
body {
  margin: 0; background: var(--night); color: var(--ink);
  font-family: var(--font-b); font-size: 15px; line-height: 1.6;
  background-image:
    radial-gradient(ellipse 70% 260px at 18% -60px, rgba(255,216,74,.22), transparent 70%),
    radial-gradient(ellipse 70% 260px at 82% -60px, rgba(255,216,74,.18), transparent 70%);
  background-attachment: fixed;
  -webkit-tap-highlight-color: transparent;
}
ruby rt { font-size: .5em; font-weight: 700; color: inherit; opacity: .85; letter-spacing: 0; }
button { font: inherit; color: inherit; cursor: pointer; }
input, select, textarea { font: inherit; }
:focus-visible { outline: 3px solid var(--light); outline-offset: 2px; }

.wrap {
  max-width: 540px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 8px calc(96px + env(safe-area-inset-bottom, 0px));
}
header.top { display: flex; align-items: center; justify-content: space-between; padding-block: 8px 14px; }
.logo { font-family: var(--font-d); font-size: 18px; letter-spacing: .04em; display: flex; align-items: center; gap: 8px; }
.logo .dia { width: 18px; height: 18px; background: var(--light); transform: rotate(45deg); border-radius: 3px; box-shadow: 0 0 14px rgba(255,216,74,.7); }
.gear { flex: none; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; width: 52px; height: 52px; display: grid; place-items: center; position: relative; touch-action: manipulation; }
.gear::after { content: ""; position: absolute; inset: -8px; }   /* 押せる範囲を見た目より広くする */
.gear svg { width: 26px; height: 26px; }
.gear:active { background: var(--panel2); transform: scale(.95); }

h2.sec { font-family: var(--font-d); font-size: 17px; margin: 22px 0 10px; letter-spacing: .03em; display: flex; align-items: baseline; gap: 10px; }
h2.sec small { font-family: var(--font-b); font-size: 12px; color: var(--dim); font-weight: 700; }
.stack { display: flex; flex-direction: column; gap: 12px; }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 18px; padding: 16px; }

/* ===== 選手カード ===== */
.card { border-radius: 22px; padding: 3px; position: relative; }
.card.t0 { background: linear-gradient(135deg,#b06a3a,#f0b07a,#7a4220); }
.card.t1 { background: linear-gradient(135deg,#9aa6c4,#f2f5ff,#6f7a98); }
.card.t2 { background: linear-gradient(135deg,#c99a10,#ffe57a,#a77800); }
.card.t3 { background: linear-gradient(135deg,#7fe7ff,#ffffff,#8aa8ff,#d4f5ff); }
.card.t4 { background: linear-gradient(135deg,#ff5a5a,#ffcf3d,#4be37f,#3db8ff,#b05cff,#ff5a5a); background-size: 300% 300%; animation: rainbow 6s linear infinite; }
@keyframes rainbow { to { background-position: 300% 0; } }
.card-in {
  border-radius: 19px; padding: 16px; overflow: hidden; position: relative;
  background:
    repeating-linear-gradient(115deg, rgba(255,255,255,.035) 0 14px, transparent 14px 28px),
    linear-gradient(160deg, #1d3270, #101c42 70%);
}
.card-top { display: flex; justify-content: space-between; align-items: center; }
.eyebrow { font-family: var(--font-d); font-size: 11px; letter-spacing: .18em; color: var(--dim); }
.tierlabel { font-size: 11px; font-weight: 800; letter-spacing: .1em; padding: 2px 10px; border-radius: 99px; background: rgba(255,255,255,.1); }
.card-mid { display: flex; gap: 14px; align-items: center; margin-top: 10px; }
.num {
  flex: none; width: 92px; height: 104px; border-radius: 14px; display: flex; flex-direction: column; align-items: center; justify-content: center;
  background: linear-gradient(180deg, rgba(255,216,74,.18), rgba(255,216,74,.04)); border: 1px solid rgba(255,216,74,.35);
}
.num small { font-size: 10px; color: var(--light); font-weight: 800; }
.num b { font-family: var(--font-d); font-size: 46px; line-height: 1.05; color: var(--light); text-shadow: 0 0 18px rgba(255,216,74,.45); font-weight: 400; }
.who { min-width: 0; flex: 1; }
.who .ttl { display: inline-block; font-size: 12px; font-weight: 800; color: #1a1300; background: var(--light); border-radius: 6px; padding: 1px 8px; }
.who .nm { font-family: var(--font-d); font-size: 26px; line-height: 1.25; margin-top: 6px; word-break: break-all; }
.who .ps { font-size: 13px; color: var(--dim); font-weight: 700; }
.stage {
  position: relative; height: 260px; margin-top: 10px; border-radius: 14px; overflow: hidden; isolation: isolate;
  background:
    radial-gradient(circle at 68% 28%, rgba(255,216,74,.38), transparent 52%),
    repeating-conic-gradient(from -8deg at 68% 110%, rgba(255,255,255,.07) 0 5deg, transparent 5deg 12deg),
    linear-gradient(180deg, #25408a, #0c1736);
}
.stage::after { content: ""; position: absolute; inset: auto 0 0 0; height: 46%; background: linear-gradient(0deg, rgba(6,12,32,.92), transparent); z-index: 1; pointer-events: none; }
.stage-num { position: absolute; right: -4px; top: -26px; font-family: var(--font-d); font-size: 210px; line-height: 1; color: rgba(255,216,74,.13); z-index: -1; }
.player.cut {
  position: absolute; right: 2%; bottom: 0; height: 97%; max-width: 72%; object-fit: contain; object-position: bottom;
  filter: drop-shadow(2px 0 0 #fff) drop-shadow(-2px 0 0 #fff) drop-shadow(0 -2px 0 #fff) drop-shadow(0 0 18px rgba(255,216,74,.75));
}
.player.raw { position: absolute; right: 14px; top: 14px; height: 76%; width: 52%; object-fit: cover; border-radius: 12px; border: 3px solid #fff; transform: rotate(3deg); box-shadow: 0 8px 24px rgba(0,0,0,.5); }
.stage-no { position: absolute; left: 14px; top: 10px; z-index: 2; display: flex; flex-direction: column; }
.stage-no small { font-size: 10px; font-weight: 800; color: var(--light); }
.stage-no b { font-family: var(--font-d); font-weight: 400; font-size: 44px; line-height: 1; color: var(--light); text-shadow: 0 0 14px rgba(255,216,74,.5); }
.stage-info { position: absolute; left: 14px; right: 14px; bottom: 12px; z-index: 2; }
.stage-info .ttl { display: inline-block; font-size: 12px; font-weight: 800; color: #1a1300; background: var(--light); border-radius: 6px; padding: 1px 8px; }
.stage-info .nm { font-family: var(--font-d); font-size: 28px; line-height: 1.2; margin-top: 4px; text-shadow: 0 2px 10px rgba(0,0,0,.8); word-break: break-all; max-width: 62%; }
.stage-info .ps { font-size: 13px; color: var(--ink); font-weight: 800; text-shadow: 0 1px 6px rgba(0,0,0,.8); }
.thumb { display: block; max-height: 160px; max-width: 100%; border-radius: 12px; margin: 0 auto; }
.thumb.cut { background: repeating-conic-gradient(#1a2c5e 0 25%, #13214a 0 50%) 0 0 / 16px 16px; }
.vh { position: absolute; width: 1px; height: 1px; opacity: 0; overflow: hidden; pointer-events: none; }
label.btn { display: inline-flex; align-items: center; justify-content: center; text-align: center; cursor: pointer; }
.busy { display: flex; align-items: center; gap: 12px; font-weight: 800; }
.spin { flex: none; width: 28px; height: 28px; border-radius: 50%; border: 4px solid var(--line); border-top-color: var(--light); animation: spin 1s linear infinite; }
.lvrow { display: flex; align-items: baseline; justify-content: space-between; margin-top: 14px; }
.lv { font-family: var(--font-d); font-size: 15px; color: var(--light); }
.lv b { font-size: 30px; font-weight: 400; margin-left: 2px; }
.expnote { font-size: 12px; color: var(--dim); font-weight: 700; }
.bar { height: 12px; border-radius: 99px; background: rgba(0,0,0,.35); overflow: hidden; margin-top: 4px; border: 1px solid rgba(255,255,255,.08); }
.bar i { display: block; height: 100%; border-radius: 99px; background: linear-gradient(90deg, var(--turf), #b8ff6a); box-shadow: 0 0 12px rgba(63,209,122,.6); transition: width .6s cubic-bezier(.2,.8,.2,1); }
.abils { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; margin-top: 14px; }
.ab { background: rgba(0,0,0,.28); border-radius: 10px; padding: 6px 2px 4px; text-align: center; }
.ab small { display: block; font-size: 10px; font-weight: 800; color: var(--dim); line-height: 1.3; min-height: 2.2em; display: flex; align-items: flex-end; justify-content: center; }
.rk { font-family: var(--font-d); font-size: 24px; line-height: 1.1; display: block; }
.ab em { font-style: normal; font-size: 11px; color: var(--dim); font-variant-numeric: tabular-nums; }
.rk-S { color: #ff5ad1; text-shadow: 0 0 10px rgba(255,90,209,.6); }
.rk-A { color: #ff6b3d; } .rk-B { color: #ffb23d; } .rk-C { color: var(--light); }
.rk-D { color: #8cf07a; } .rk-E { color: #5fd3ff; } .rk-F { color: #9fb0e0; } .rk-G { color: #7181ad; }

/* ===== きょう ===== */
.today { display: flex; gap: 16px; align-items: center; }
.ring { flex: none; width: 104px; height: 104px; position: relative; }
.ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.ring .pct { position: absolute; inset: 0; display: grid; place-items: center; font-family: var(--font-d); font-size: 26px; }
.ring .pct span { font-size: 13px; }
.ring.full svg { filter: drop-shadow(0 0 8px rgba(255,216,74,.8)); }
.today-txt { flex: 1; min-width: 0; }
.today-txt .big { font-family: var(--font-d); font-size: 18px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
.chip { font-size: 12px; font-weight: 800; padding: 3px 10px; border-radius: 99px; background: var(--panel2); border: 1px solid var(--line); }
.chip.fire { color: var(--score); border-color: rgba(255,107,61,.5); }
.btn {
  border: 0; border-radius: 14px; padding: 13px 18px; font-weight: 800; font-size: 15px;
  background: linear-gradient(180deg, #ffe46e, #ffc928); color: #241800;
  box-shadow: 0 4px 0 #b88a00, 0 0 18px rgba(255,216,74,.25);
}
.btn:active { transform: translateY(3px); box-shadow: 0 1px 0 #b88a00; }
.btn.wide { width: 100%; }
.btn.sub { background: var(--panel2); color: var(--ink); box-shadow: 0 4px 0 #0b1430; border: 1px solid var(--line); }
.btn.sm { padding: 8px 12px; font-size: 13px; border-radius: 10px; }
.step-now { display: flex; gap: 12px; align-items: center; }
.step-now .flag { flex: none; width: 40px; height: 40px; border-radius: 12px; background: rgba(255,107,61,.15); display: grid; place-items: center; color: var(--score); font-family: var(--font-d); }

/* ===== れんしゅう ===== */
.dayhead { display: flex; justify-content: space-between; align-items: flex-end; }
.dayhead .d { font-family: var(--font-d); font-size: 22px; }
.dayhead .c { font-family: var(--font-d); color: var(--light); font-size: 20px; }
.items { display: flex; flex-direction: column; gap: 10px; margin-top: 12px; }
.item {
  width: 100%; text-align: left; display: flex; gap: 12px; align-items: center; position: relative;
  background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 12px 14px;
  transition: transform .12s, background .2s, border-color .2s;
}
.item:active { transform: scale(.98); }
.item .ck { flex: none; width: 36px; height: 36px; border-radius: 50%; border: 3px solid var(--line); display: grid; place-items: center; transition: .2s; }
.item .ck svg { width: 20px; height: 20px; opacity: 0; }
.item .tx { flex: 1; min-width: 0; }
.item .tx b { display: block; font-size: 17px; font-weight: 800; }
.item .tx small { color: var(--dim); font-weight: 700; font-size: 12px; }
.item { cursor: pointer; }
.cntsel { display: inline-flex; align-items: center; gap: 4px; margin-top: 2px; }
.cntsel select { background: #0b1636; color: var(--light); border: 1px solid var(--line); border-radius: 9px; padding: 3px 8px; font-size: 16px; font-weight: 800; font-family: var(--font-d); }
.item .xp { flex: none; font-family: var(--font-d); font-size: 13px; color: var(--light); }
.item.done { background: linear-gradient(90deg, rgba(63,209,122,.2), var(--panel)); border-color: rgba(63,209,122,.55); }
.item.done .ck { background: var(--turf); border-color: var(--turf); box-shadow: 0 0 14px rgba(63,209,122,.6); }
.item.done .ck svg { opacity: 1; }
.item.done .tx b { color: #c9ffd9; }
.tags { display: inline-flex; gap: 4px; margin-left: 6px; }
.tag { font-size: 10px; font-weight: 800; padding: 0 6px; border-radius: 5px; background: rgba(255,255,255,.08); color: var(--dim); }
.float { position: absolute; right: 16px; top: 4px; font-family: var(--font-d); color: var(--light); pointer-events: none; animation: up 1s ease-out forwards; text-shadow: 0 0 10px rgba(255,216,74,.7); }
@keyframes up { from { opacity: 1; transform: translateY(0) scale(1.2); } to { opacity: 0; transform: translateY(-40px) scale(1); } }

/* ===== きろく ===== */
.stats { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
.stat { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; }
.stat small { font-size: 12px; color: var(--dim); font-weight: 800; }
.stat b { display: block; font-family: var(--font-d); font-size: 26px; font-weight: 400; font-variant-numeric: tabular-nums; line-height: 1.3; }
.stat b span { font-size: 13px; margin-left: 2px; color: var(--dim); }
.heat-wrap { overflow-x: auto; }
.heat { display: grid; grid-auto-flow: column; grid-template-rows: repeat(7, 1fr); gap: 4px; width: max-content; }
.heat i { width: 15px; height: 15px; border-radius: 4px; background: rgba(255,255,255,.06); }
.heat i.l1 { background: rgba(63,209,122,.35); } .heat i.l2 { background: rgba(63,209,122,.65); }
.heat i.l3 { background: var(--turf); box-shadow: 0 0 6px rgba(63,209,122,.6); }
.heat i.fut { background: transparent; }
.heat i.now { outline: 2px solid var(--light); }
.legend { display: flex; gap: 6px; align-items: center; font-size: 11px; color: var(--dim); margin-top: 10px; font-weight: 700; }
.legend i { width: 12px; height: 12px; border-radius: 3px; display: inline-block; }
.radar { display: block; margin: 0 auto; width: 100%; max-width: 300px; }
.totals { display: flex; flex-direction: column; }
.totals div { display: flex; justify-content: space-between; gap: 10px; padding: 10px 2px; border-bottom: 1px solid var(--line); font-weight: 700; }
.totals div:last-child { border-bottom: 0; }
.totals em { font-style: normal; font-family: var(--font-d); color: var(--light); font-variant-numeric: tabular-nums; white-space: nowrap; }

/* ===== しあい ===== */
.score-board { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.sb { background: #050a1c; border: 1px solid var(--line); border-radius: 12px; padding: 10px 6px; text-align: center; }
.sb small { font-size: 11px; color: var(--dim); font-weight: 800; display: block; }
.sb b { font-family: var(--font-d); font-weight: 400; font-size: 24px; color: var(--score); font-variant-numeric: tabular-nums; text-shadow: 0 0 10px rgba(255,107,61,.45); }
.game { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 14px; }
.game-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.game-top .vs { font-weight: 800; min-width: 0; word-break: break-all; }
.res { font-family: var(--font-d); font-size: 13px; padding: 2px 10px; border-radius: 8px; flex: none; }
.res.w { background: var(--score); color: #fff; } .res.l { background: #3a4a80; } .res.d { background: #5a5a6a; }
.game .sc { font-family: var(--font-d); font-size: 28px; font-variant-numeric: tabular-nums; }
.game .line { font-size: 13px; color: var(--dim); font-weight: 700; }
.game .memo { margin-top: 8px; font-size: 14px; background: rgba(0,0,0,.2); border-radius: 10px; padding: 8px 10px; white-space: pre-wrap; word-break: break-all; }
.memo small { display: block; font-size: 11px; font-weight: 800; color: var(--dim); }
.memo.next { border-left: 3px solid var(--score); }
.lastgame { background: linear-gradient(135deg, #050a1c, #14234f); border: 1px solid var(--line); border-radius: 16px; padding: 12px 14px; display: flex; flex-direction: column; gap: 6px; }
.lg-head { display: flex; justify-content: space-between; align-items: center; }
.lg-score { display: flex; align-items: center; gap: 8px; }
.lg-score .vs { font-weight: 800; flex: 1; min-width: 0; word-break: break-all; }
.lg-score b { font-family: var(--font-d); font-weight: 400; font-size: 24px; color: var(--score); font-variant-numeric: tabular-nums; text-shadow: 0 0 10px rgba(255,107,61,.45); }
.lastgame .line { font-size: 13px; color: var(--dim); font-weight: 700; }
.lg-theme { background: rgba(255,107,61,.14); border: 1px solid rgba(255,107,61,.5); border-radius: 12px; padding: 8px 10px; font-weight: 800; font-size: 15px; white-space: pre-wrap; word-break: break-all; }
.lg-theme small, .lg-good small { display: block; font-size: 11px; color: var(--score); font-weight: 800; }
.lg-good { font-size: 14px; white-space: pre-wrap; word-break: break-all; }
.lg-good small { color: var(--dim); }
.form { display: flex; flex-direction: column; gap: 12px; }
.field label { display: block; font-size: 12px; font-weight: 800; color: var(--dim); margin-bottom: 4px; }
.field input, .field select, .field textarea {
  width: 100%; background: #0b1636; color: var(--ink); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; font-size: 16px;
}
.field textarea { min-height: 72px; resize: vertical; }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.counters { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.cnt { display: flex; align-items: center; justify-content: space-between; gap: 6px; background: #0b1636; border: 1px solid var(--line); border-radius: 12px; padding: 6px 6px 6px 10px; }
.cnt span { font-size: 13px; font-weight: 800; min-width: 0; }
.cnt .ctl { display: flex; align-items: center; gap: 4px; flex: none; }
.cnt button { width: 32px; height: 32px; border-radius: 9px; border: 1px solid var(--line); background: var(--panel2); font-weight: 800; font-size: 18px; line-height: 1; }
.cnt b { font-family: var(--font-d); font-weight: 400; width: 22px; text-align: center; font-variant-numeric: tabular-nums; }
.hint { font-size: 12px; color: var(--dim); font-weight: 700; }

/* ===== もくひょう ===== */
.goal-ladder { display: flex; flex-direction: column; gap: 0; }
.rung { position: relative; padding-left: 26px; padding-bottom: 14px; }
.rung::before { content: ""; position: absolute; left: 8px; top: 22px; bottom: 0; width: 2px; background: var(--line); }
.rung:last-child::before { display: none; }
.rung .dot { position: absolute; left: 0; top: 10px; width: 18px; height: 18px; border-radius: 50%; background: var(--panel2); border: 2px solid var(--line); }
.rung.dream .dot { background: var(--light); border-color: var(--light); box-shadow: 0 0 12px rgba(255,216,74,.7); }
.rung .field input { font-weight: 700; }
.rung.dream .field input { font-family: var(--font-d); font-size: 18px; color: var(--light); }
.steps { display: flex; flex-direction: column; gap: 8px; }
.stp { display: flex; align-items: center; gap: 10px; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 8px 8px 8px 10px; }
.stp .ck2 { flex: none; width: 30px; height: 30px; border-radius: 9px; border: 2px solid var(--line); background: transparent; display: grid; place-items: center; }
.stp .ck2 svg { width: 16px; height: 16px; opacity: 0; }
.stp.done .ck2 { background: var(--score); border-color: var(--score); } .stp.done .ck2 svg { opacity: 1; }
.stp .t { flex: 1; min-width: 0; font-weight: 700; word-break: break-all; }
.stp.done .t { color: var(--dim); text-decoration: line-through; }
.stp .del, .del { flex: none; background: transparent; border: 1px solid var(--line); border-radius: 9px; padding: 4px 10px; font-size: 12px; font-weight: 800; color: var(--dim); }
.del.armed { background: var(--score); color: #fff; border-color: var(--score); }

  o.getContext("2d").drawImage(c, x0, y0, o.width, o.height, 0, 0, o.width, o.height);
  return shrink(o, 520, "image/png");
}

/* ---------- ぜんぶの数字を記録から計算する ---------- */
function compute() {
  let exp = 0; const ab = { meet: 0, power: 0, speed: 0, arm: 0, def: 0 }; const totals = {};
  const days = Object.keys(S.logs).filter(d => Object.keys(S.logs[d].done || {}).length).sort();
  let run = 0, prev = null, best = 0;
  for (const d of days) {
    const L = S.logs[d];
    for (const id in L.done) {
      const e = L.done[id]; exp += e.exp || 0;
      for (const k in (e.ab || {})) ab[k] = (ab[k] || 0) + e.ab[k];
      const t = totals[e.name] || (totals[e.name] = { name: e.name, unit: e.unit, count: 0, times: 0 });
      t.count += e.count || 0; t.times++;
    }
    if (L.clear) exp += CLEAR_BONUS;
    run = (prev && addDays(prev, 1) === d) ? run + 1 : 1; prev = d;
    best = Math.max(best, run); exp += streakBonus(run);
  }
  const today = ymd();
  const cur = days.length && (prev === today || prev === addDays(today, -1)) ? run : 0;
  exp += S.games.length * GAME_EXP;
  exp += S.goals.steps.filter(s => s.done).length * STEP_EXP;
  exp += Object.keys(S.reviews).length * REVIEW_EXP;
  let lv = 1, rest = exp;
  while (lv < MAX_LV && rest >= needFor(lv)) { rest -= needFor(lv); lv++; }
  return { exp, ab, totals, days: days.length, best, cur, lv, into: lv >= MAX_LV ? 1 : rest, need: lv >= MAX_LV ? 1 : needFor(lv) };
}
const abVal = pts => Math.min(99, 10 + pts);
const rank = v => v >= 80 ? "S" : v >= 70 ? "A" : v >= 60 ? "B" : v >= 50 ? "C" : v >= 40 ? "D" : v >= 30 ? "E" : v >= 20 ? "F" : "G";
const titleIdx = lv => lv >= MAX_LV ? 10 : Math.floor(lv / 5);
function todayStats() {
  const act = S.menu.filter(m => m.on); const L = S.logs[ymd()] || { done: {} };
  const done = act.filter(m => L.done && L.done[m.id]).length;
  return { done, total: act.length, pct: act.length ? Math.round(done / act.length * 100) : 0 };
}

const GRADES = [["a", "◎ できた"], ["b", "○ もう{少|すこ}し"], ["c", "△ できなかった"]];

const ymLabel = ym => { const [y, m] = ym.split("-").map(Number); return `${y}{年|ねん}${m}{月|がつ}`; };
const prevYm = ym => { const [y, m] = ym.split("-").map(Number); return m === 1 ? `${y - 1}-12` : `${y}-${pad(m - 1)}`; };
const daysIn = ym => { const [y, m] = ym.split("-").map(Number); return new Date(y, m, 0).getDate(); };
// ふりかえりができる月：はじめた月〜先月。今月も、のこり3日になったらできる
function reviewableMonths() {
  const today = ymd(), cur = today.slice(0, 7), first = (S.started || today).slice(0, 7);
  const out = [];
  if (Number(today.slice(8)) >= daysIn(cur) - 2) out.push(cur);
  for (let ym = prevYm(cur); ym >= first; ym = prevYm(ym)) out.push(ym);
  return out;
}
const pendingReviews = () => reviewableMonths().filter(ym => !S.reviews[ym]);
function monthStats(ym) {
  const days = Object.keys(S.logs).filter(d => d.startsWith(ym) && Object.keys(S.logs[d].done || {}).length);
  let exp = 0, swing = 0, clear = 0;
  for (const d of days) { const L = S.logs[d]; if (L.clear) { clear++; exp += CLEAR_BONUS; }
    for (const id in L.done) { const e = L.done[id]; exp += e.exp || 0; if (plain(e.name) === "素振り") swing += e.count || 0; } }
  const games = S.games.filter(g => g.date.startsWith(ym));
  let h = 0, ab = 0; for (const g of games) { h += hitsOf(g.ab); ab += atBats(g.ab); }
  exp += games.length * GAME_EXP;
  const steps = S.goals.steps.filter(s => s.done && (s.doneDate || "").startsWith(ym)).length;
  exp += steps * STEP_EXP;
  return { days: days.length, dim: daysIn(ym), clear, swing, games: games.length, avg: ab ? (h / ab).toFixed(3).replace(/^0/, "") : "---", steps, exp };
}

function celebrate(before, after, head, homerun) {
  const up = after.lv > before.lv, tUp = titleIdx(after.lv) > titleIdx(before.lv);

  } else if (head) h += `<div class="big">${head}</div>`;

  if (up) more += `<div class="${head || homerun ? "mid" : "big"}">LEVEL UP!</div><div class="mid">Lv.${before.lv} → Lv.${after.lv}</div>`;

function homerunFx(cv) {
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  const W = cv.width = innerWidth * dpr, H = cv.height = innerHeight * dpr, ctx = cv.getContext("2d");
  const t0 = performance.now(), parts = [], trail = [];
  const bursts = [[950, .74, .2], [1250, .28, .26], [1500, .55, .13], [1800, .82, .4], [2100, .18, .16], [2450, .5, .3]];
  const cols = ["#ffd84a", "#ff6b3d", "#ffffff", "#3fd17a", "#7fe7ff", "#ff5ad1"];
  let fired = 0;
  const bez = (a, b, c, p) => (1 - p) * (1 - p) * a + 2 * (1 - p) * p * b + p * p * c;
  function burst([, bx, by]) {
    const c1 = cols[Math.floor(Math.random() * cols.length)], c2 = cols[Math.floor(Math.random() * cols.length)];
    for (let i = 0; i < 80; i++) {
      const a = Math.random() * Math.PI * 2, sp = (1.5 + Math.random() * 4.5) * dpr;
      parts.push({ x: bx * W, y: by * H, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: 1, c: i % 2 ? c1 : c2, s: (1.4 + Math.random() * 1.8) * dpr });
    }
  }
  function frame(now) {
    if (!cv.isConnected || cv.closest("[hidden]")) return;
    const t = now - t0; ctx.clearRect(0, 0, W, H);
    if (t < 180) { ctx.fillStyle = `rgba(255,255,255,${0.75 * (1 - t / 180)})`; ctx.fillRect(0, 0, W, H); }   // バットに当たった瞬間の光
    if (t < 950) {
      const p = t / 950, e = 1 - Math.pow(1 - p, 2);
      const x = bez(.08 * W, .45 * W, .74 * W, e), y = bez(.95 * H, -.15 * H, .2 * H, e), r = 16 * (1 - e * .75) * dpr;
      trail.push({ x, y, r });
      if (trail.length > 22) trail.shift();
      trail.forEach((q, i) => { ctx.beginPath(); ctx.fillStyle = `rgba(255,255,255,${(i / trail.length) * .35})`; ctx.arc(q.x, q.y, q.r * (i / trail.length), 0, 7); ctx.fill(); });
      ctx.beginPath(); ctx.fillStyle = "#fff"; ctx.shadowColor = "#fff"; ctx.shadowBlur = 20 * dpr; ctx.arc(x, y, r, 0, 7); ctx.fill(); ctx.shadowBlur = 0;
      ctx.strokeStyle = "#e33"; ctx.lineWidth = Math.max(1, r * .14);
      ctx.beginPath(); ctx.arc(x - r * .9, y, r * .7, -.9, .9); ctx.stroke(); ctx.beginPath(); ctx.arc(x + r * .9, y, r * .7, Math.PI - .9, Math.PI + .9); ctx.stroke();
    }
    while (fired < bursts.length && t >= bursts[fired][0]) burst(bursts[fired++]);
    for (let i = parts.length - 1; i >= 0; i--) {
      const q = parts[i]; q.vy += .045 * dpr; q.vx *= .985; q.vy *= .985; q.x += q.vx; q.y += q.vy; q.life -= .011;
      if (q.life <= 0) { parts.splice(i, 1); continue; }
      ctx.globalAlpha = q.life; ctx.fillStyle = q.c; ctx.beginPath(); ctx.arc(q.x, q.y, q.s, 0, 7); ctx.fill();
    }
    ctx.globalAlpha = 1;
    if (t < 1000 || fired < bursts.length || parts.length) requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
}
// 音（カキーン！と歓声）。ボタンを押した時に音の準備をしておかないとiPhoneでは鳴らない
let AC = null;
function audioUnlock() {
  if (S.sound === false) return;
  try { AC = AC || new (window.AudioContext || window.webkitAudioContext)(); if (AC.state === "suspended") AC.resume(); } catch (e) {}
}
function noiseBuf(sec, shape) {
  const n = Math.floor(AC.sampleRate * sec), b = AC.createBuffer(1, n, AC.sampleRate), d = b.getChannelData(0);
  for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (shape ? shape(i / n) : 1);
  const s = AC.createBufferSource(); s.buffer = b; return s;
}
function sfxHomerun() {
  if (S.sound === false || !AC) return;
  try {
    const t = AC.currentTime + .02, out = AC.destination;
    const crack = noiseBuf(.09, p => Math.pow(1 - p, 3)), hp = AC.createBiquadFilter(), g1 = AC.createGain();
    hp.type = "highpass"; hp.frequency.value = 1400; g1.gain.value = .9; crack.connect(hp); hp.connect(g1); g1.connect(out); crack.start(t);
    const o = AC.createOscillator(), g2 = AC.createGain();
    o.type = "triangle"; o.frequency.setValueAtTime(2300, t); o.frequency.exponentialRampToValueAtTime(950, t + .18);
    g2.gain.setValueAtTime(.32, t); g2.gain.exponentialRampToValueAtTime(.001, t + .3); o.connect(g2); g2.connect(out); o.start(t); o.stop(t + .35);
    const cheer = noiseBuf(2.8), bp = AC.createBiquadFilter(), g3 = AC.createGain();
    bp.type = "bandpass"; bp.frequency.value = 900; bp.Q.value = .5;
    g3.gain.setValueAtTime(.0001, t + .15); g3.gain.exponentialRampToValueAtTime(.22, t + .8); g3.gain.exponentialRampToValueAtTime(.001, t + 2.9);
    cheer.connect(bp); bp.connect(g3); g3.connect(out); cheer.start(t + .15);
  } catch (e) {}
}
// アプリを開いた時の演出
function splash() {
  if (reduced()) return;
  const name = S.profile && S.profile.name;
  const el = document.createElement("div"); el.className = "splash"; el.setAttribute("aria-hidden", "true");
  el.innerHTML = `<div class="sp-beam l"></div><div class="sp-beam r"></div>
    <div class="sp-lamps l">${"<i></i>".repeat(8)}</div><div class="sp-lamps r">${"<i></i>".repeat(8)}</div>
    <div class="sp-field"></div><div class="sp-ballway"><div class="sp-ball"></div></div>
    <div class="sp-center">
      <img class="sp-logo" src="icon.png?v=2" alt="" onerror="this.remove()">
      <div class="sp-title">${R("{水田|みずた}{自主|じしゅ}トレロード")}</div>
      <div class="sp-sub">PLAY BALL!</div>
      ${name ? `<div class="sp-name">${esc(name)}${R("{選手|せんしゅ}、きょうもいこう！")}</div>` : ""}
    </div>
    <div class="sp-skip">${R("タップでスキップ")}</div>`;
  document.body.appendChild(el);
  let done = false;
  const end = () => { if (done) return; done = true; el.classList.add("out"); setTimeout(() => el.remove(), 500); };
  el.addEventListener("click", end); setTimeout(end, 2900);
}
function floatAt(id, text) {
  const el = document.querySelector(`[data-act="toggle"][data-v="${id}"]`); if (!el) return;
  const f = document.createElement("span"); f.className = "float"; f.textContent = text; el.appendChild(f);
  setTimeout(() => f.remove(), 1000);
}

/* ---------- うごき ---------- */
const A = {
  tab(v) { tab = v; render(); window.scrollTo(0, 0); },
  photoUse(v) {
    const w = photoWork; if (!w) return;
    const ok = savePhoto({ src: v === "cut" && w.cut ? w.cut : w.raw, cut: v === "cut" && !!w.cut });
    photoWork = ok ? null : { state: "error", msg: "{写真|しゃしん}をほぞんできなかったよ。スマホの{空|あ}きが{少|すく}ないかも" };
    if (ok) { tab = "home"; window.scrollTo(0, 0); }
    render();
  },
  swSound() { S.sound = S.sound === false; save(); if (S.sound) { audioUnlock(); } render(); },
  photoCancel() { photoWork = null; render(); },
  photoDel() { savePhoto(null); render(); },
  goReview() { tab = "goal"; render(); const el = document.getElementById("reviews"); if (el) el.scrollIntoView(); },
  saveProfile() {
    const name = document.getElementById("pf-name").value.trim();
    if (!name) { document.getElementById("pf-name").focus(); return; }
    S.profile = { name, number: document.getElementById("pf-num").value.trim(), position: document.getElementById("pf-pos").value.trim() };
    save(); tab = "home"; render(); window.scrollTo(0, 0);
  },
  toggle(id) {
    const before = compute(); const d = ymd();
    const L = S.logs[d] || (S.logs[d] = { done: {} });
    const m = S.menu.find(x => x.id === id); if (!m) return;
    const adding = !L.done[id];
    if (adding) L.done[id] = { name: m.name, exp: itemExp(m, m.count), ab: itemAb(m, m.count), count: m.count, unit: m.unit };
    else delete L.done[id];
    const act = S.menu.filter(x => x.on); const wasClear = !!L.clear;
    L.clear = act.length > 0 && act.every(x => L.done[x.id]);
    if (!Object.keys(L.done).length) delete S.logs[d];
    save(); render();
    if (adding) floatAt(id, `+${itemExp(m, m.count)} EXP`);
    const after = compute();
    setTimeout(() => celebrate(before, after, "", L.clear && !wasClear), adding ? 450 : 0);
  },
  setCount(id, n) {   // 素振りの回数をえらんだ時。チェック済みなら今日の記録も直す
    const m = S.menu.find(x => x.id === id); if (!m) return;
    const before = compute();
    m.count = n;
    const L = S.logs[ymd()];
    if (L && L.done[id]) Object.assign(L.done[id], { count: n, exp: itemExp(m, n), ab: itemAb(m, n) });
    save(); render(); celebrate(before, compute(), "");
  },
  newGame() { draft = newDraft(); render(); },
  cancelGame() { draft = null; render(); },
  cnt(k, b) {
    const d = Number(b.dataset.d);
    if (k.startsWith("ab.")) { const kk = k.slice(3); draft.ab[kk] = Math.max(0, draft.ab[kk] + d); }
    else draft[k] = Math.max(0, draft[k] + d);
    const y = window.scrollY; render(); window.scrollTo(0, y);
  },
  saveGame() {
    const before = compute(); const g = draft;
    S.games.push({ id: uid(), date: g.date || ymd(), opp: g.opp.trim(), my: Math.max(0, parseInt(g.my) || 0), their: Math.max(0, parseInt(g.their) || 0), ab: { ...g.ab }, rbi: g.rbi, sb: g.sb, memo: "", good: g.good.trim(), next: g.next.trim() });
    draft = null; save(); render(); celebrate(before, compute(), "");
  },
  delGame(id) { S.games = S.games.filter(g => g.id !== id); save(); render(); },
  addStep() {
    const i = document.getElementById("step-new"); const t = i.value.trim(); if (!t) { i.focus(); return; }
    S.goals.steps.push({ id: uid(), text: t, done: false }); save(); render();
    document.getElementById("step-new").focus();
  },
  step(id) {
    const before = compute(); const s = S.goals.steps.find(x => x.id === id); if (!s) return;
    s.done = !s.done; s.doneDate = s.done ? ymd() : null; save(); render();
    if (s.done) celebrate(before, compute(), "ステップ<br>" + R("{達成|たっせい}！"));
  },
  rvGrade(v) {
    const [ym, k] = v.split("|"); (rvDraft[ym] || (rvDraft[ym] = { goal: "", grade: "", good: "", next: "" })).grade = k;
    const y = window.scrollY; render(); window.scrollTo(0, y);
  },
  saveReview(ym) {
    const d = rvDraft[ym] || {};
    const before = compute();
    S.reviews[ym] = { goal: (d.goal || "").trim(), grade: d.grade || "", good: (d.good || "").trim(), next: (d.next || "").trim(), at: ymd() };
    delete rvDraft[ym]; save();
    const y = window.scrollY; render(); window.scrollTo(0, y);
    celebrate(before, compute(), R("ふりかえり") + "<br>" + R("{完了|かんりょう}！"));
  },
  delReview(ym) { delete S.reviews[ym]; save(); render(); },
  delStep(id) { S.goals.steps = S.goals.steps.filter(x => x.id !== id); save(); render(); },
  swMenu(id) { const m = S.menu.find(x => x.id === id); if (m) { m.on = !m.on; save(); render(); } },
  delMenu(id) { S.menu = S.menu.filter(x => x.id !== id); save(); render(); },
  addMenu() {
    const n = document.getElementById("nm-name"); const name = n.value.trim(); if (!name) { n.focus(); return; }
    const ab = document.getElementById("nm-ab").value;
    S.menu.push({ id: "c" + uid(), name, count: Math.max(1, parseInt(document.getElementById("nm-count").value) || 1), unit: document.getElementById("nm-unit").value,
      exp: parseInt(document.getElementById("nm-exp").value) || 15, ab: ab ? { [ab]: 1 } : {}, on: true, custom: true });
    save(); render();
  },
};
const NEEDS_CONFIRM = new Set(["delGame", "delStep", "delMenu", "delReview", "photoDel"]);
document.addEventListener("click", e => {
  const b = e.target.closest("[data-act]"); if (!b) return;
  if (b.dataset.act === "toggle") audioUnlock();
  const ctl = e.target.closest("select, input, textarea, label");
  if (ctl && ctl !== b && b.contains(ctl)) return;   // 行の中の回数えらびを押した時はチェックしない
  const a = b.dataset.act;
  if (NEEDS_CONFIRM.has(a) && !b.classList.contains("armed")) {
    b.classList.add("armed"); b.innerHTML = R("もう{一度|いちど}で{消|け}す");
    setTimeout(() => { if (b.isConnected) { b.classList.remove("armed"); b.innerHTML = R("{消|け}す"); } }, 3000);
    return;
  }
  A[a] && A[a](b.dataset.v, b, e);
});
document.addEventListener("input", e => {
  const t = e.target;
  if (t.dataset.draft && draft) draft[t.dataset.draft] = t.value;
  if (t.dataset.rv) { const [ym, f] = t.dataset.rv.split("|"); (rvDraft[ym] || (rvDraft[ym] = { goal: "", grade: "", good: "", next: "" }))[f] = t.value; }
});
document.addEventListener("change", e => {
  const t = e.target;
  if (t.dataset.goal) { S.goals[t.dataset.goal] = t.value.trim(); if (t.dataset.goal === "month") S.goals.monthKey = ymd().slice(0, 7); save(); }
  if (t.dataset.count) A.setCount(t.dataset.count, parseInt(t.value) || 10);
  if (t.id === "photo-in" && t.files && t.files[0]) { const f = t.files[0]; t.value = ""; handlePhoto(f); }
});
document.addEventListener("keydown", e => {
  if (e.key === "Enter" && e.target.id === "step-new") A.addStep();
  if ((e.key === "Enter" || e.key === " ") && e.target.matches('div[data-act="toggle"]')) { e.preventDefault(); audioUnlock(); A.toggle(e.target.dataset.v); }
});

S = loadState();
loadPhoto();
render();
splash();
</script>
