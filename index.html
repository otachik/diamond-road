<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}</style>
<title>水田トレーニングロード</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="水田トレーニングロード">
<meta name="theme-color" content="#0a1430">
<link rel="apple-touch-icon" href="icon.png?v=2">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=M+PLUS+Rounded+1c:wght@400;700;800&display=swap">
<style>
/* レイアウト：ナイターの球場。上に照明の光、まん中に選手カード、下にスコアボード風のタブ */
:root {
  --night: #0a1430;      /* 夜空 */
  --panel: #13214a;      /* 板 */
  --panel2: #1a2c5e;
  --line: #2b3f7a;
  --light: #ffd84a;      /* 照明の黄色 */
  --score: #ff6b3d;      /* スコアボードのオレンジ */
  --turf: #3fd17a;       /* 芝の緑 */
  --ink: #eef2ff;
  --dim: #95a4d0;
  --font-d: "Dela Gothic One", "Hiragino Sans", "Yu Gothic", sans-serif;
  --font-b: "M PLUS Rounded 1c", "Hiragino Maru Gothic ProN", "Hiragino Sans", sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }   /* 演出の黒い幕を、閉じた時にちゃんと消す */
html, body { min-height: 100%; }
body {
  margin: 0; background: var(--night); color: var(--ink);
  font-family: var(--font-b); font-size: 15px; line-height: 1.6;
  background-image:
    radial-gradient(ellipse 70% 260px at 18% -60px, rgba(255,216,74,.22), transparent 70%),
    radial-gradient(ellipse 70% 260px at 82% -60px, rgba(255,216,74,.18), transparent 70%);
  background-attachment: fixed;
  -webkit-tap-highlight-color: transparent;
}
ruby rt { font-size: .5em; font-weight: 700; color: inherit; opacity: .85; letter-spacing: 0; }
button { font: inherit; color: inherit; cursor: pointer; }
input, select, textarea { font: inherit; }
:focus-visible { outline: 3px solid var(--light); outline-offset: 2px; }

.wrap {
  max-width: 540px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 8px calc(96px + env(safe-area-inset-bottom, 0px));
}
header.top { display: flex; align-items: center; justify-content: space-between; padding-block: 8px 14px; }
.logo { font-family: var(--font-d); font-size: 16px; letter-spacing: .02em; min-width: 0; white-space: nowrap; display: flex; align-items: center; gap: 8px; }
.logo .dia { width: 18px; height: 18px; background: var(--light); transform: rotate(45deg); border-radius: 3px; box-shadow: 0 0 14px rgba(255,216,74,.7); }
.gear { flex: none; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; width: 52px; height: 52px; display: grid; place-items: center; position: relative; touch-action: manipulation; }
.gear::after { content: ""; position: absolute; inset: -8px; }   /* 押せる範囲を見た目より広くする */
.gear svg { width: 26px; height: 26px; }
.hdr-btns { display: flex; gap: 10px; flex: none; }
.gear.help { font-family: var(--font-d); font-size: 24px; color: var(--light); }
.help-doc details { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; }
.help-doc summary { list-style: none; cursor: pointer; padding: 14px 16px; font-family: var(--font-d); font-size: 16px; display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.help-doc summary::-webkit-details-marker { display: none; }
.help-doc summary::after { content: "＋"; color: var(--light); font-family: var(--font-b); font-weight: 800; }
.help-doc details[open] summary::after { content: "−"; }
.help-doc .body { padding: 0 16px 16px; font-size: 14px; line-height: 2; }
.help-doc .body h3 { font-size: 14px; margin: 10px 0 2px; color: var(--light); }
.help-doc .body p { margin: 4px 0; }
.help-doc .body ul { margin: 4px 0; padding-left: 20px; }
.help-doc .warn { background: rgba(255,107,61,.12); border: 1px solid rgba(255,107,61,.5); border-radius: 12px; padding: 8px 12px; margin: 8px 0; font-weight: 700; }
.help-doc .rows div { display: flex; justify-content: space-between; gap: 10px; padding: 4px 0; border-bottom: 1px solid var(--line); }
.help-doc .rows div:last-child { border-bottom: 0; }
.help-doc .rows em { font-style: normal; font-family: var(--font-d); color: var(--light); white-space: nowrap; }
.gear:active { background: var(--panel2); transform: scale(.95); }

h2.sec { font-family: var(--font-d); font-size: 17px; margin: 22px 0 10px; letter-spacing: .03em; }
h2.sec small { font-family: var(--font-b); font-size: 12px; color: var(--dim); font-weight: 700; margin-left: 10px; letter-spacing: 0; }
.stack { display: flex; flex-direction: column; gap: 12px; }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 18px; padding: 16px; }

/* ===== 選手カード ===== */
.card { border-radius: 22px; padding: 3px; position: relative; }
.card.t0 { background: linear-gradient(135deg,#b06a3a,#f0b07a,#7a4220); }
.card.t1 { background: linear-gradient(135deg,#9aa6c4,#f2f5ff,#6f7a98); }
.card.t2 { background: linear-gradient(135deg,#c99a10,#ffe57a,#a77800); }
.card.t3 { background: linear-gradient(135deg,#7fe7ff,#ffffff,#8aa8ff,#d4f5ff); }
.card.t4 { background: linear-gradient(135deg,#ff5a5a,#ffcf3d,#4be37f,#3db8ff,#b05cff,#ff5a5a); background-size: 300% 300%; animation: rainbow 6s linear infinite; }
@keyframes rainbow { to { background-position: 300% 0; } }
.card-in {
  border-radius: 19px; padding: 16px; overflow: hidden; position: relative;
  background:
    repeating-linear-gradient(115deg, rgba(255,255,255,.035) 0 14px, transparent 14px 28px),
    linear-gradient(160deg, #1d3270, #101c42 70%);
}
.card-top { display: flex; justify-content: space-between; align-items: center; }
.eyebrow { font-family: var(--font-d); font-size: 11px; letter-spacing: .18em; color: var(--dim); }
.tierlabel { font-size: 11px; font-weight: 800; letter-spacing: .1em; padding: 2px 10px; border-radius: 99px; background: rgba(255,255,255,.1); }
.card-mid { display: flex; gap: 14px; align-items: center; margin-top: 10px; }
.num {
  flex: none; width: 92px; height: 104px; border-radius: 14px; display: flex; flex-direction: column; align-items: center; justify-content: center;
  background: linear-gradient(180deg, rgba(255,216,74,.18), rgba(255,216,74,.04)); border: 1px solid rgba(255,216,74,.35);
}
.num small { font-size: 10px; color: var(--light); font-weight: 800; }
.num b { font-family: var(--font-d); font-size: 46px; line-height: 1.05; color: var(--light); text-shadow: 0 0 18px rgba(255,216,74,.45); font-weight: 400; }
.who { min-width: 0; flex: 1; }
.who .ttl { display: inline-block; font-size: 12px; font-weight: 800; color: #1a1300; background: var(--light); border-radius: 6px; padding: 1px 8px; }
.who .nm { font-family: var(--font-d); font-size: 26px; line-height: 1.25; margin-top: 6px; word-break: break-all; }
.who .ps { font-size: 13px; color: var(--dim); font-weight: 700; }
.stage {
  position: relative; height: 260px; margin-top: 10px; border-radius: 14px; overflow: hidden; isolation: isolate;
  background:
    radial-gradient(circle at 68% 28%, rgba(255,216,74,.38), transparent 52%),
    repeating-conic-gradient(from -8deg at 68% 110%, rgba(255,255,255,.07) 0 5deg, transparent 5deg 12deg),
    linear-gradient(180deg, #25408a, #0c1736);
}
.stage::after { content: ""; position: absolute; inset: auto 0 0 0; height: 46%; background: linear-gradient(0deg, rgba(6,12,32,.92), transparent); z-index: 1; pointer-events: none; }
.stage-num { position: absolute; right: -4px; top: -26px; font-family: var(--font-d); font-size: 210px; line-height: 1; color: rgba(255,216,74,.13); z-index: -1; }
.player.cut {
  position: absolute; right: 2%; bottom: 0; height: 97%; max-width: 72%; object-fit: contain; object-position: bottom;
  filter: drop-shadow(2px 0 0 #fff) drop-shadow(-2px 0 0 #fff) drop-shadow(0 -2px 0 #fff) drop-shadow(0 0 18px rgba(255,216,74,.75));
}
.player.raw { position: absolute; right: 14px; top: 14px; height: 76%; width: 52%; object-fit: cover; border-radius: 12px; border: 3px solid #fff; transform: rotate(3deg); box-shadow: 0 8px 24px rgba(0,0,0,.5); }
.stage-no { position: absolute; left: 14px; top: 10px; z-index: 2; display: flex; flex-direction: column; }
.stage-no small { font-size: 10px; font-weight: 800; color: var(--light); }
.stage-no b { font-family: var(--font-d); font-weight: 400; font-size: 44px; line-height: 1; color: var(--light); text-shadow: 0 0 14px rgba(255,216,74,.5); }
.stage-info { position: absolute; left: 14px; right: 14px; bottom: 12px; z-index: 2; }
.stage-info .ttl { display: inline-block; font-size: 12px; font-weight: 800; color: #1a1300; background: var(--light); border-radius: 6px; padding: 1px 8px; }
.stage-info .nm { font-family: var(--font-d); font-size: 28px; line-height: 1.2; margin-top: 4px; text-shadow: 0 2px 10px rgba(0,0,0,.8); word-break: break-all; max-width: 62%; }
.stage-info .ps { font-size: 13px; color: var(--ink); font-weight: 800; text-shadow: 0 1px 6px rgba(0,0,0,.8); }
.thumb { display: block; max-height: 160px; max-width: 100%; border-radius: 12px; margin: 0 auto; }
.thumb.cut { background: repeating-conic-gradient(#1a2c5e 0 25%, #13214a 0 50%) 0 0 / 16px 16px; }
.warn-box { display: flex; flex-direction: column; gap: 8px; background: rgba(255,107,61,.12); border: 1px solid rgba(255,107,61,.6); border-radius: 14px; padding: 12px; }
.del-btn.armed, .btn.armed { background: var(--score); color: #fff; box-shadow: 0 4px 0 #8a2c10; }
.bk-msg { font-weight: 800; color: var(--turf); }
.bk-text { width: 100%; height: 90px; font-size: 12px; background: #0b1636; color: var(--ink); border: 1px solid var(--line); border-radius: 12px; padding: 8px; }
.vh { position: absolute; width: 1px; height: 1px; opacity: 0; overflow: hidden; pointer-events: none; }
label.btn { display: inline-flex; align-items: center; justify-content: center; text-align: center; cursor: pointer; }
.busy { display: flex; align-items: center; gap: 12px; font-weight: 800; }
.spin { flex: none; width: 28px; height: 28px; border-radius: 50%; border: 4px solid var(--line); border-top-color: var(--light); animation: spin 1s linear infinite; }
.lvrow { display: flex; align-items: baseline; justify-content: space-between; margin-top: 14px; }
.lv { font-family: var(--font-d); font-size: 15px; color: var(--light); }
.lv b { font-size: 30px; font-weight: 400; margin-left: 2px; }
.expnote { font-size: 12px; color: var(--dim); font-weight: 700; }
.bar { height: 12px; border-radius: 99px; background: rgba(0,0,0,.35); overflow: hidden; margin-top: 4px; border: 1px solid rgba(255,255,255,.08); }
.bar i { display: block; height: 100%; border-radius: 99px; background: linear-gradient(90deg, var(--turf), #b8ff6a); box-shadow: 0 0 12px rgba(63,209,122,.6); transition: width .6s cubic-bezier(.2,.8,.2,1); }
.abils { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; margin-top: 14px; }
.ab { background: rgba(0,0,0,.28); border-radius: 10px; padding: 6px 2px 4px; text-align: center; }
.ab small { display: block; font-size: 10px; font-weight: 800; color: var(--dim); line-height: 1.3; min-height: 2.2em; display: flex; align-items: flex-end; justify-content: center; }
.rk { font-family: var(--font-d); font-size: 24px; line-height: 1.1; display: block; }
.ab em { font-style: normal; font-size: 11px; color: var(--dim); font-variant-numeric: tabular-nums; }
.rk-S { color: #ff5ad1; text-shadow: 0 0 10px rgba(255,90,209,.6); }
.rk-A { color: #ff6b3d; } .rk-B { color: #ffb23d; } .rk-C { color: var(--light); }
.rk-D { color: #8cf07a; } .rk-E { color: #5fd3ff; } .rk-F { color: #9fb0e0; } .rk-G { color: #7181ad; }

/* ===== きょう ===== */
.today { display: flex; gap: 16px; align-items: center; }
.ring { flex: none; width: 104px; height: 104px; position: relative; }
.ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.ring .pct { position: absolute; inset: 0; display: grid; place-items: center; font-family: var(--font-d); font-size: 26px; }
.ring .pct span { font-size: 13px; }
.ring.full svg { filter: drop-shadow(0 0 8px rgba(255,216,74,.8)); }
.today-txt { flex: 1; min-width: 0; }
.today-txt .big { font-family: var(--font-d); font-size: 18px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
.chip { font-size: 12px; font-weight: 800; padding: 3px 10px; border-radius: 99px; background: var(--panel2); border: 1px solid var(--line); }
.chip.fire { color: var(--score); border-color: rgba(255,107,61,.5); }
.btn {
  border: 0; border-radius: 14px; padding: 13px 18px; font-weight: 800; font-size: 15px;
  background: linear-gradient(180deg, #ffe46e, #ffc928); color: #241800;
  box-shadow: 0 4px 0 #b88a00, 0 0 18px rgba(255,216,74,.25);
}
.btn:active { transform: translateY(3px); box-shadow: 0 1px 0 #b88a00; }
.btn.wide { width: 100%; }
.btn.sub { background: var(--panel2); color: var(--ink); box-shadow: 0 4px 0 #0b1430; border: 1px solid var(--line); }
.btn.sm { padding: 8px 12px; font-size: 13px; border-radius: 10px; }
.step-now { display: flex; gap: 12px; align-items: center; }
.step-now .flag { flex: none; width: 40px; height: 40px; border-radius: 12px; background: rgba(255,107,61,.15); display: grid; place-items: center; color: var(--score); font-family: var(--font-d); }

/* ===== れんしゅう ===== */
.dayhead { display: flex; justify-content: space-between; align-items: flex-end; }
.dayhead .d { font-family: var(--font-d); font-size: 22px; }
.dayhead .c { font-family: var(--font-d); color: var(--light); font-size: 20px; }
.items { display: flex; flex-direction: column; gap: 10px; margin-top: 12px; }
.item {
  width: 100%; text-align: left; display: flex; gap: 12px; align-items: center; position: relative;
  background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 12px 14px;
  transition: transform .12s, background .2s, border-color .2s;
}
.item:active { transform: scale(.98); }
.item .ck { flex: none; width: 36px; height: 36px; border-radius: 50%; border: 3px solid var(--line); display: grid; place-items: center; transition: .2s; }
.item .ck svg { width: 20px; height: 20px; opacity: 0; }
.item .tx { flex: 1; min-width: 0; }
.item .tx b { display: block; font-size: 17px; font-weight: 800; }
.item .tx small { color: var(--dim); font-weight: 700; font-size: 12px; }
.item { cursor: pointer; }
.cntsel { display: inline-flex; align-items: center; gap: 4px; margin-top: 2px; }
.cntsel select { background: #0b1636; color: var(--light); border: 1px solid var(--line); border-radius: 9px; padding: 3px 8px; font-size: 16px; font-weight: 800; font-family: var(--font-d); }
.item .xp { flex: none; font-family: var(--font-d); font-size: 13px; color: var(--light); }
.item.done { background: linear-gradient(90deg, rgba(63,209,122,.2), var(--panel)); border-color: rgba(63,209,122,.55); }
.item.done .ck { background: var(--turf); border-color: var(--turf); box-shadow: 0 0 14px rgba(63,209,122,.6); }
.item.done .ck svg { opacity: 1; }
.item.done .tx b { color: #c9ffd9; }
.tags { display: inline-flex; gap: 4px; margin-left: 6px; }
.tag { font-size: 10px; font-weight: 800; padding: 0 6px; border-radius: 5px; background: rgba(255,255,255,.08); color: var(--dim); }
.float { position: absolute; right: 16px; top: 4px; font-family: var(--font-d); color: var(--light); pointer-events: none; animation: up 1s ease-out forwards; text-shadow: 0 0 10px rgba(255,216,74,.7); }
@keyframes up { from { opacity: 1; transform: translateY(0) scale(1.2); } to { opacity: 0; transform: translateY(-40px) scale(1); } }

/* ===== きろく ===== */
.stats { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
.stat { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; }
.stat small { font-size: 12px; color: var(--dim); font-weight: 800; }
.stat b { display: block; font-family: var(--font-d); font-size: 26px; font-weight: 400; font-variant-numeric: tabular-nums; line-height: 1.3; }
.stat b span { font-size: 13px; margin-left: 2px; color: var(--dim); }
.theme-card { background: linear-gradient(135deg, #061a14, #123a2c); border: 1px solid var(--line); border-radius: 16px; padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; }
.loop { display: flex; align-items: center; flex-wrap: wrap; gap: 4px; font-size: 12px; font-weight: 800; }
.loop span { padding: 2px 8px; border-radius: 999px; border: 1px solid currentColor; }
.loop .s { color: var(--turf); } .loop .t { color: #6aa8ff; } .loop .g { color: var(--score); } .loop .k { color: var(--light); }
.loop i { font-style: normal; color: var(--dim); }
.tday.on { background: rgba(63,209,122,.18); border-color: var(--turf); color: var(--turf); }
.cal-nav { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
.cal-nav b { font-size: 16px; }
.cal-nav button { width: 40px; height: 40px; border-radius: 12px; background: var(--panel2); color: var(--ink); font-size: 22px; border: 1px solid var(--line); }
.cal-nav button:disabled { opacity: .3; }
.cal { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; }
.cal-wd { text-align: center; font-size: 11px; color: var(--dim); font-weight: 800; padding-bottom: 2px; }
.cal-wd.sun { color: #ff8a8a; } .cal-wd.sat { color: #8ab8ff; }
.cal-d { min-width: 0; min-height: 46px; border-radius: 10px; background: rgba(255,255,255,.05); border: 1.5px solid transparent; color: var(--ink); display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 5px 0 4px; font: inherit; }
.cal-d .n { font-size: 13px; font-weight: 800; line-height: 1; }
.cal-d.empty { background: none; }
.cal-d.fut { opacity: .35; }
.cal-d.now { border-color: rgba(255,216,74,.6); }
.cal-d.sel { background: rgba(255,216,74,.2); border-color: var(--light); }
.mks { display: flex; gap: 3px; flex-wrap: wrap; justify-content: center; }
.mk { display: inline-block; width: 8px; height: 8px; border-radius: 50%; flex: none; }
.mk.self { background: var(--turf); }
.mk.self.clear { background: var(--light); box-shadow: 0 0 4px var(--light); }
.mk.tp { background: #5aa0ff; border-radius: 2px; }
.mk.gm { background: var(--score); border-radius: 1px; transform: rotate(45deg) scale(.9); }
.mk.rest { border: 1.5px solid var(--dim); }
.cal-legend { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 11px; color: var(--dim); margin-top: 10px; }
.cal-legend span { display: inline-flex; align-items: center; gap: 4px; }
.cal-sum { margin-top: 6px; font-size: 12px; font-weight: 800; color: var(--dim); }
.day-detail { margin-top: 12px; border-top: 1px solid var(--line); padding-top: 10px; }
.dd-head { font-weight: 800; }
.dd { margin-top: 8px; border-left: 3px solid var(--line); background: rgba(0,0,0,.2); border-radius: 8px; padding: 6px 10px; font-size: 14px; white-space: pre-wrap; word-break: break-all; }
.dd > * + * { margin-top: 4px; }
.dd small { display: block; font-size: 11px; font-weight: 800; color: var(--dim); }
.dd.self { border-color: var(--turf); } .dd.tp { border-color: #5aa0ff; } .dd.gmd { border-color: var(--score); } .dd.rest, .dd.note { border-color: var(--dim); }
.dd-line { font-size: 12px; color: var(--dim); font-weight: 700; }
.dd-del { text-align: right; }
.heat-wrap { overflow-x: auto; }
.heat { display: grid; grid-auto-flow: column; grid-template-rows: repeat(7, 1fr); gap: 4px; width: max-content; }
.heat i { width: 15px; height: 15px; border-radius: 4px; background: rgba(255,255,255,.06); }
.heat i.l1 { background: rgba(63,209,122,.35); } .heat i.l2 { background: rgba(63,209,122,.65); }
.heat i.l3 { background: var(--turf); box-shadow: 0 0 6px rgba(63,209,122,.6); }
.heat i.fut { background: transparent; }
.heat i.now { outline: 2px solid var(--light); }
.legend { display: flex; gap: 6px; align-items: center; font-size: 11px; color: var(--dim); margin-top: 10px; font-weight: 700; }
.legend i { width: 12px; height: 12px; border-radius: 3px; display: inline-block; }
.radar { display: block; margin: 0 auto; width: 100%; max-width: 300px; }
.totals { display: flex; flex-direction: column; }
.totals div { display: flex; justify-content: space-between; gap: 10px; padding: 10px 2px; border-bottom: 1px solid var(--line); font-weight: 700; }
.totals div:last-child { border-bottom: 0; }
.totals em { font-style: normal; font-family: var(--font-d); color: var(--light); font-variant-numeric: tabular-nums; white-space: nowrap; }

/* ===== しあい ===== */
.score-board { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.sb { background: #050a1c; border: 1px solid var(--line); border-radius: 12px; padding: 10px 6px; text-align: center; }
.sb small { font-size: 11px; color: var(--dim); font-weight: 800; display: block; }
.sb b { font-family: var(--font-d); font-weight: 400; font-size: 24px; color: var(--score); font-variant-numeric: tabular-nums; text-shadow: 0 0 10px rgba(255,107,61,.45); }
.game { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 14px; }
.game-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.game-top .vs { font-weight: 800; min-width: 0; word-break: break-all; }
.res { font-family: var(--font-d); font-size: 13px; padding: 2px 10px; border-radius: 8px; flex: none; }
.res.w { background: var(--score); color: #fff; } .res.l { background: #3a4a80; } .res.d { background: #5a5a6a; }
.game .sc { font-family: var(--font-d); font-size: 28px; font-variant-numeric: tabular-nums; }
.game .line { font-size: 13px; color: var(--dim); font-weight: 700; }
.game .memo { margin-top: 8px; font-size: 14px; background: rgba(0,0,0,.2); border-radius: 10px; padding: 8px 10px; white-space: pre-wrap; word-break: break-all; }
.memo small { display: block; font-size: 11px; font-weight: 800; color: var(--dim); }
.memo.next { border-left: 3px solid var(--score); }
.lastgame { background: linear-gradient(135deg, #050a1c, #14234f); border: 1px solid var(--line); border-radius: 16px; padding: 12px 14px; display: flex; flex-direction: column; gap: 6px; }
.lg-head { display: flex; justify-content: space-between; align-items: center; }
.lg-score { display: flex; align-items: center; gap: 8px; }
.lg-score .vs { font-weight: 800; flex: 1; min-width: 0; word-break: break-all; }
.lg-score b { font-family: var(--font-d); font-weight: 400; font-size: 24px; color: var(--score); font-variant-numeric: tabular-nums; text-shadow: 0 0 10px rgba(255,107,61,.45); }
.lastgame .line { font-size: 13px; color: var(--dim); font-weight: 700; }
.lg-theme { background: rgba(255,107,61,.14); border: 1px solid rgba(255,107,61,.5); border-radius: 12px; padding: 8px 10px; font-weight: 800; font-size: 15px; white-space: pre-wrap; word-break: break-all; }
.lg-theme small, .lg-good small { display: block; font-size: 11px; color: var(--score); font-weight: 800; }
.lg-good { font-size: 14px; white-space: pre-wrap; word-break: break-all; }
.lg-good small { color: var(--dim); }
.form { display: flex; flex-direction: column; gap: 12px; }
.field label { display: block; font-size: 12px; font-weight: 800; color: var(--dim); margin-bottom: 4px; }
.field input, .field select, .field textarea {
  width: 100%; background: #0b1636; color: var(--ink); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; font-size: 16px;
}
.field textarea { min-height: 72px; resize: vertical; }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.counters { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.cnt { display: flex; align-items: center; justify-content: space-between; gap: 6px; background: #0b1636; border: 1px solid var(--line); border-radius: 12px; padding: 6px 6px 6px 10px; }
.cnt span { font-size: 13px; font-weight: 800; min-width: 0; }
.cnt .ctl { display: flex; align-items: center; gap: 4px; flex: none; }
.cnt button { width: 32px; height: 32px; border-radius: 9px; border: 1px solid var(--line); background: var(--panel2); font-weight: 800; font-size: 18px; line-height: 1; }
.cnt b { font-family: var(--font-d); font-weight: 400; width: 22px; text-align: center; font-variant-numeric: tabular-nums; }
.hint { font-size: 12px; color: var(--dim); font-weight: 700; }

/* ===== もくひょう ===== */
.goal-ladder { display: flex; flex-direction: column; gap: 0; }
.rung { position: relative; padding-left: 26px; padding-bottom: 14px; }
.rung::before { content: ""; position: absolute; left: 8px; top: 22px; bottom: 0; width: 2px; background: var(--line); }
.rung:last-child::before { display: none; }
.rung .dot { position: absolute; left: 0; top: 10px; width: 18px; height: 18px; border-radius: 50%; background: var(--panel2); border: 2px solid var(--line); }
.rung.dream .dot { background: var(--light); border-color: var(--light); box-shadow: 0 0 12px rgba(255,216,74,.7); }
.rung .field input { font-weight: 700; }
.rung.dream .field input { font-family: var(--font-d); font-size: 18px; color: var(--light); }
.steps { display: flex; flex-direction: column; gap: 8px; }
.stp { display: flex; align-items: center; gap: 10px; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 8px 8px 8px 10px; }
.stp .ck2 { flex: none; width: 30px; height: 30px; border-radius: 9px; border: 2px solid var(--line); background: transparent; display: grid; place-items: center; }
.stp .ck2 svg { width: 16px; height: 16px; opacity: 0; }
.stp.done .ck2 { background: var(--score); border-color: var(--score); } .stp.done .ck2 svg { opacity: 1; }
.stp .t { flex: 1; min-width: 0; font-weight: 700; word-break: break-all; }
.stp.done .t { color: var(--dim); text-decoration: line-through; }
.stp .del, .del { flex: none; background: transparent; border: 1px solid var(--line); border-radius: 9px; padding: 4px 10px; font-size: 12px; font-weight: 800; color: var(--dim); }
.del.armed { background: var(--score); color: #fff; border-color: var(--score); }
.addrow { display: flex; gap: 8px; }
.addrow input { flex: 1; min-width: 0; background: #0b1636; color: var(--ink); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; font-size: 16px; }

.explain b { font-size: 15px; }
.explain p { margin: 6px 0 8px; font-size: 14px; }
.explain ul { margin: 0; padding-left: 20px; font-size: 14px; font-weight: 700; display: flex; flex-direction: column; gap: 2px; }
.explain .ex { margin-top: 10px; font-size: 13px; color: var(--light); background: rgba(255,216,74,.08); border-radius: 10px; padding: 8px 10px; font-weight: 700; }
.rv-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-family: var(--font-d); font-size: 18px; }
.mstats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-top: 10px; }
.mstats div { background: rgba(0,0,0,.25); border-radius: 10px; padding: 6px 8px; min-width: 0; }
.mstats small { display: block; font-size: 10px; font-weight: 800; color: var(--dim); }
.mstats b { font-family: var(--font-d); font-weight: 400; font-size: 18px; font-variant-numeric: tabular-nums; }
.mstats b span { font-family: var(--font-b); font-size: 11px; color: var(--dim); font-weight: 800; }
.grades { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.grade { background: #0b1636; border: 1px solid var(--line); border-radius: 12px; padding: 10px 4px; font-weight: 800; font-size: 13px; }
.grade.on { background: var(--light); color: #241800; border-color: var(--light); }
.chip.grade-a { color: var(--light); border-color: rgba(255,216,74,.5); } .chip.grade-c { color: var(--dim); }
.review .rv-row { margin-top: 10px; font-size: 14px; white-space: pre-wrap; word-break: break-all; }
.review .rv-row small { display: block; font-size: 11px; font-weight: 800; color: var(--dim); }
.rv-banner { width: 100%; display: flex; align-items: center; gap: 12px; text-align: left; border: 1px solid rgba(255,107,61,.6); background: linear-gradient(90deg, rgba(255,107,61,.22), var(--panel)); border-radius: 16px; padding: 12px 14px; }
.rv-banner .flag { flex: none; width: 40px; height: 40px; border-radius: 12px; background: var(--score); display: grid; place-items: center; font-size: 20px; color: #fff; }
.rv-banner b { display: block; font-size: 16px; } .rv-banner small { color: var(--dim); font-weight: 700; font-size: 12px; }

/* ===== せってい ===== */
.mrow { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--line); }
.mrow:last-child { border-bottom: 0; }
.mrow .t { flex: 1; min-width: 0; font-weight: 700; }
.mrow .t small { display: block; color: var(--dim); font-size: 12px; }
.sw { flex: none; width: 50px; height: 30px; border-radius: 99px; border: 0; background: #33416e; position: relative; }
.sw::after { content: ""; position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; border-radius: 50%; background: #fff; transition: left .2s; }
.sw.on { background: var(--turf); } .sw.on::after { left: 23px; }
.note { font-size: 12px; color: var(--dim); background: rgba(255,255,255,.04); border: 1px dashed var(--line); border-radius: 12px; padding: 10px 12px; }

/* ===== したのタブ ===== */
nav.tabs {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
  background: rgba(6,12,32,.94); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  border-top: 1px solid var(--line);
  padding: 6px max(8px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(8px, env(safe-area-inset-left, 0px));
}
nav.tabs .in { max-width: 540px; margin: 0 auto; display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; }
nav.tabs button { background: transparent; border: 0; border-radius: 12px; padding: 6px 2px; display: flex; flex-direction: column; align-items: center; gap: 2px; color: var(--dim); font-size: 11px; font-weight: 800; }
nav.tabs svg { width: 24px; height: 24px; }
nav.tabs button.on { color: var(--light); background: rgba(255,216,74,.1); }

/* ===== 演出 ===== */
.ov { position: fixed; inset: 0; z-index: 50; display: grid; place-items: center; background: rgba(3,6,18,.82); padding: 24px; }
.ov .box { text-align: center; position: relative; animation: pop .5s cubic-bezier(.2,1.4,.4,1); max-width: 360px; width: 100%; }
.ov .rays { position: absolute; left: 50%; top: 50%; width: 520px; height: 520px; margin: -260px 0 0 -260px; z-index: -1; border-radius: 50%;
  background: repeating-conic-gradient(rgba(255,216,74,.18) 0 10deg, transparent 10deg 20deg); animation: spin 12s linear infinite;
  -webkit-mask: radial-gradient(circle, #000 20%, transparent 65%); mask: radial-gradient(circle, #000 20%, transparent 65%); }
.ov .big { font-family: var(--font-d); font-size: 44px; line-height: 1.1; color: var(--light); text-shadow: 0 0 24px rgba(255,216,74,.8), 0 4px 0 #b88a00; }
.ov .mid { font-family: var(--font-d); font-size: 20px; margin-top: 12px; }
.ov .sm2 { font-weight: 800; color: var(--dim); margin-top: 8px; }
.ov .newttl { display: inline-block; margin-top: 14px; padding: 6px 16px; border-radius: 10px; background: var(--light); color: #1a1300; font-weight: 800; font-size: 18px; }
.ov .tap { margin-top: 26px; font-size: 12px; color: var(--dim); font-weight: 700; }
@keyframes pop { from { transform: scale(.4); opacity: 0; } to { transform: scale(1); opacity: 1; } }
@keyframes spin { to { transform: rotate(360deg); } }
/* ===== 開いた時の演出（ナイターの照明がつく → ボールが飛ぶ → タイトル） ===== */
.splash { position: fixed; inset: 0; z-index: 100; background: #040817; overflow: hidden; display: grid; place-items: center; transition: opacity .45s; cursor: pointer; }
.splash.out { opacity: 0; pointer-events: none; }
.sp-beam { position: absolute; top: -12%; width: 75%; height: 125%; opacity: 0;
  background: linear-gradient(180deg, rgba(255,244,190,.42), rgba(255,244,190,.06) 70%, transparent);
  clip-path: polygon(38% 0, 52% 0, 100% 100%, 0 100%); animation: lighton .9s .1s forwards; }
.sp-beam.l { left: -28%; transform: rotate(-22deg); transform-origin: 45% 0; }
.sp-beam.r { right: -28%; transform: rotate(22deg) scaleX(-1); transform-origin: 55% 0; animation-delay: .28s; }
.sp-lamps { position: absolute; top: 5%; display: grid; grid-template-columns: repeat(4, 12px); gap: 5px; opacity: 0; animation: lighton .9s .1s forwards; }
.sp-lamps.l { left: 9%; } .sp-lamps.r { right: 9%; animation-delay: .28s; }
.sp-lamps i { width: 12px; height: 12px; border-radius: 50%; background: #fff7cf; box-shadow: 0 0 12px 4px rgba(255,236,150,.85); }
@keyframes lighton { 0% { opacity: 0; } 15% { opacity: .9; } 22% { opacity: .1; } 34% { opacity: 1; } 42% { opacity: .5; } 55%, 100% { opacity: 1; } }
.sp-field { position: absolute; left: 50%; bottom: -34vmin; width: 100vmin; height: 100vmin; transform: translateX(-50%) rotate(45deg); border-radius: 8px;
  background: radial-gradient(circle at 70% 70%, #1d7a42, #0e3d24 70%); box-shadow: 0 0 0 10px #8a5a32, 0 0 80px rgba(63,209,122,.35); opacity: 0; animation: fadein .6s .35s forwards; }
.sp-field::after { content: ""; position: absolute; inset: 22%; border: 4px solid rgba(255,255,255,.75); }
@keyframes fadein { to { opacity: 1; } }
.sp-ballway { position: absolute; left: 0; right: 0; top: 64%; height: 0; transform: rotate(-26deg); pointer-events: none; }
.sp-ball { position: absolute; left: 0; top: -11px; width: 22px; height: 22px; border-radius: 50%; background: #fff; transform: translateX(-30vw);
  box-shadow: inset -3px -3px 0 rgba(0,0,0,.12), 0 0 18px rgba(255,255,255,.9); animation: fly .75s .45s cubic-bezier(.25,.75,.35,1) forwards; }
.sp-ball::before { content: ""; position: absolute; right: 50%; top: 7px; width: 46vw; height: 8px; border-radius: 4px; background: linear-gradient(90deg, transparent, rgba(255,255,255,.85)); }
.sp-ball::after { content: ""; position: absolute; inset: 3px 5px; border-left: 2px dashed #e33; border-right: 2px dashed #e33; border-radius: 50%; }
@keyframes fly { to { transform: translateX(150vw); } }
.sp-center { position: relative; z-index: 2; display: flex; flex-direction: column; align-items: center; text-align: center; padding: 0 20px; animation: shake .35s 1.15s; }
.sp-logo { width: 104px; height: 104px; object-fit: contain; border-radius: 22px; background: #fff; padding: 6px; box-shadow: 0 0 34px rgba(255,216,74,.55); transform: scale(0); animation: pop2 .45s .95s cubic-bezier(.2,1.6,.4,1) forwards; }
.sp-title { font-family: var(--font-d); font-size: clamp(24px, 7.4vw, 44px); line-height: 1.25; margin-top: 14px; color: #fff; opacity: 0;
  text-shadow: 0 0 26px rgba(255,216,74,.85), 0 4px 0 #b88a00; animation: slam .45s 1.1s cubic-bezier(.2,1.3,.4,1) forwards; }
.sp-title rt { font-size: .32em; }
.sp-sub { font-family: var(--font-d); font-size: 22px; letter-spacing: .14em; color: var(--score); margin-top: 10px; padding: 2px 14px; border: 3px solid var(--score); border-radius: 8px;
  transform: rotate(-6deg) scale(2.2); opacity: 0; animation: stamp .3s 1.5s cubic-bezier(.3,1.5,.5,1) forwards; text-shadow: 0 0 12px rgba(255,107,61,.6); }
.sp-only { margin-top: 12px; font-weight: 800; font-size: 14px; color: #241800; background: var(--light); border-radius: 99px; padding: 2px 14px; opacity: 0; animation: fadein .4s 1.6s forwards; }
.field input.locked { background: rgba(255,216,74,.08); border-color: rgba(255,216,74,.4); color: var(--light); font-weight: 800; }
.sp-name { margin-top: 14px; font-weight: 800; color: var(--light); opacity: 0; animation: fadein .4s 1.75s forwards; }
.sp-skip { position: absolute; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); left: 0; right: 0; text-align: center; font-size: 12px; color: var(--dim); font-weight: 700; }
@keyframes pop2 { to { transform: scale(1); } }
@keyframes slam { from { opacity: 0; transform: scale(2.6); } to { opacity: 1; transform: scale(1); } }
@keyframes stamp { to { opacity: 1; transform: rotate(-6deg) scale(1); } }
@keyframes shake { 0%, 100% { transform: translate(0); } 20% { transform: translate(-6px, 3px); } 40% { transform: translate(5px, -4px); } 60% { transform: translate(-4px, 2px); } 80% { transform: translate(3px, -1px); } }

/* ===== チャレンジ・ボス・休養日・ごほうび ===== */
.chal { display: flex; align-items: center; gap: 12px; background: linear-gradient(90deg, rgba(255,216,74,.16), var(--panel)); border: 1px solid rgba(255,216,74,.5); border-radius: 16px; padding: 10px 14px; }
.chal-mark { flex: none; width: 36px; height: 36px; border-radius: 10px; background: var(--light); color: #241800; display: grid; place-items: center; font-family: var(--font-d); font-size: 20px; }
.chal-mark svg { width: 20px; height: 20px; }
.chal.ok { border-color: rgba(63,209,122,.6); background: linear-gradient(90deg, rgba(63,209,122,.2), var(--panel)); }
.chal.ok .chal-mark { background: var(--turf); }
.chal-tx { flex: 1; min-width: 0; } .chal-tx small { display: block; font-size: 11px; color: var(--dim); font-weight: 800; } .chal-tx b { font-size: 16px; }
.chal-xp { flex: none; font-family: var(--font-d); color: var(--light); }
.boss { background: linear-gradient(135deg, #2a0f2e, #1a1640 60%, #0f1a40); border: 1px solid #5a2d6a; border-radius: 16px; padding: 12px 14px; display: flex; flex-direction: column; gap: 6px; }
.boss-top { display: flex; justify-content: space-between; align-items: center; }
.boss-name { font-family: var(--font-d); font-size: 19px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.chip.gold { background: var(--light); color: #241800; border-color: var(--light); }
.hp { position: relative; height: 18px; border-radius: 6px; background: rgba(0,0,0,.45); overflow: hidden; border: 1px solid rgba(255,255,255,.1); }
.hp i { display: block; height: 100%; background: linear-gradient(90deg, #ff3d5a, #ff8a3d); box-shadow: 0 0 10px rgba(255,61,90,.6); transition: width .6s; }
.hp span { position: absolute; inset: 0; display: grid; place-items: center; font-size: 11px; font-weight: 800; text-shadow: 0 1px 2px #000; }
.wk { background: linear-gradient(135deg, #0b1a3a, #13284f); border: 1px solid var(--line); border-radius: 16px; padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; }
.wk-days { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; text-align: center; }
.wk-days span { display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 11px; color: var(--dim); font-weight: 800; }
.wk-days i { width: 26px; height: 26px; border-radius: 8px; background: rgba(255,255,255,.07); border: 1.5px solid transparent; }
.wk-days .on i { background: var(--turf); box-shadow: 0 0 6px rgba(63,209,122,.5); }
.wk-days .rest i { border-color: var(--dim); background: none; }
.wk-days .now i { border-color: var(--light); }
.wk-days .fut { opacity: .4; }
.wk-sum { font-weight: 800; display: flex; align-items: baseline; gap: 2px; flex-wrap: wrap; }
.wk-sum b { font-family: var(--font-d); font-weight: 400; font-size: 22px; color: var(--light); margin-left: 2px; }
.wk-sum .hint { margin-left: auto; }
.bk-nag { background: linear-gradient(135deg, #3a2208, #2a1a10); border: 1.5px solid rgba(255,170,60,.7); border-radius: 16px; padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; }
.bk-top { display: flex; align-items: center; gap: 8px; font-size: 16px; }
.bk-ico { font-size: 22px; }
.boss.won { border-color: rgba(255,216,74,.6); }
.rest-on { background: rgba(127,231,255,.1); border: 1px solid rgba(127,231,255,.45); border-radius: 14px; padding: 10px 12px; font-weight: 800; font-size: 14px; color: #bff3ff; }
.btn[disabled] { opacity: .45; pointer-events: none; }
.tool-btn { flex: none; width: 40px; height: 40px; border-radius: 12px; border: 1px solid var(--line); background: #0b1636; color: var(--light); display: grid; place-items: center; }
.tool-btn svg { width: 22px; height: 22px; }
.reward .rw { padding: 8px 0; border-bottom: 1px solid var(--line); }
.reward .rw:last-child { border-bottom: 0; padding-bottom: 0; }
.rw-top { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; }
.rw-top b { min-width: 0; word-break: break-all; } .rw-top span { flex: none; font-size: 12px; color: var(--dim); font-weight: 800; }
.rw.ok .bar i { background: linear-gradient(90deg, #ffd84a, #ff8a3d); }
.rw.ok .hint { color: var(--light); }
.cmp div { display: grid; grid-template-columns: 1fr auto auto auto; gap: 10px; align-items: baseline; padding: 8px 0; border-bottom: 1px solid var(--line); font-weight: 700; }
.cmp div:last-child { border-bottom: 0; }
.cmp b { font-family: var(--font-d); font-weight: 400; font-variant-numeric: tabular-nums; text-align: right; }
.cmp .old { color: var(--dim); font-size: 13px; font-variant-numeric: tabular-nums; text-align: right; }
.cmp .up { color: var(--turf); font-size: 12px; font-weight: 800; min-width: 54px; text-align: right; } .cmp .down { color: var(--dim); font-size: 12px; font-weight: 800; min-width: 54px; text-align: right; }
.cmp .head { color: var(--dim); font-size: 11px; }

/* ===== 練習のおとも（カウンター・タイマー） ===== */
.tool { position: fixed; inset: 0; z-index: 60; background: rgba(3,6,18,.94); display: flex; flex-direction: column; padding: calc(16px + env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) calc(16px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.tool-in { max-width: 480px; width: 100%; margin: 0 auto; flex: 1; display: flex; flex-direction: column; gap: 14px; }
.tool-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.tool-head b { font-family: var(--font-d); font-size: 22px; }

/* ---------- バックアップ（記録を1つのファイルや文字にして、とっておく・もどす） ---------- */
const BK_APP = "mizuta-jishutore";
let bkMsg = "", bkText = "", pendingRestore = null;
const backupJson = withPhoto => JSON.stringify({ app: BK_APP, v: 2, at: ymd(), data: S, photo: withPhoto ? PHOTO : null });
function parseBackup(text) {
  try {
    const o = JSON.parse(String(text).trim());
    if (o && o.app === BK_APP && o.data && typeof o.data === "object" && typeof o.data.logs === "object") return o;
  } catch (e) {}
  return null;
}
function backupSummary(o) {
  const keep = S; S = normalize(o.data); const c = compute(); const name = S.profile.name; S = keep;
  return { name, lv: c.lv, days: c.days, at: o.at || "", photo: !!o.photo };
}
function bkDone(msg) {
  const before = compute(), d = ymd(), newWeek = !S.bkDays.some(x => weekStart(x) === weekStart(d));
  S.lastBackup = d; if (!S.bkDays.includes(d)) S.bkDays.push(d); save(); bkMsg = msg; render();
  celebrate(before, compute(), R("{記録|きろく}を{保存|ほぞん}したよ！") + (newWeek ? `<br><span style='font-size:.5em'>+${BK_EXP} EXP</span>` : ""));
}
// ホームに出す「保存しよう」。今週まだ保存していない時に出す（記録が何もない時は出さない）
function backupNag(c) {
  if (!(c.days || S.games.length || S.tp.length)) return "";
  const d = ymd(), last = S.lastBackup;
  if (last && weekStart(last) === weekStart(d)) return "";
  return `<section class="bk-nag">
    <div class="bk-top"><span class="bk-ico">💾</span><b>${R(last ? `{今週|こんしゅう}の{保存|ほぞん}がまだだよ（さいごは${md(last)}）` : "まだ{記録|きろく}を{保存|ほぞん}していないよ")}</b></div>
    <div class="hint">${R(`スマホがこわれたり、{機種変更|きしゅへんこう}したりしても、{保存|ほぞん}しておけば{記録|きろく}をもどせるよ。{週|しゅう}に1{回|かい}、{保存|ほぞん}すると +${BK_EXP} EXP`)}</div>
    <button class="btn wide" data-act="makeBackup">${R("いま{保存|ほぞん}する")}</button>
    <div class="hint">${R("{出|で}てきた{画面|がめん}で「“ファイル”に{保存|ほぞん}」をえらぶか、LINEでおうちの{人|ひと}に{送|おく}ってね")}</div>
    ${bkMsg ? `<div class="bk-msg">${R(bkMsg)}</div>` : ""}
  </section>`;
}
async function makeBackup() {
  const name = `mizuta-jishutore-${ymd()}.json`;
  const file = new File([backupJson(true)], name, { type: "application/json" });
  try {
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      await navigator.share({ files: [file], title: "水田トレーニングロードのバックアップ" });
      return bkDone("バックアップをほぞんしたよ");
    }
  } catch (e) { if (e && e.name === "AbortError") return; }
  try {
    const a = document.createElement("a"); a.href = URL.createObjectURL(file); a.download = name;
    document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 2000);
    bkDone("バックアップのファイルをほぞんしたよ");
  } catch (e) { bkMsg = "ファイルにできなかったよ。「{文字|もじ}でコピー」をためしてね"; render(); }
}
async function copyBackup() {
  const t = backupJson(false);
  try { await navigator.clipboard.writeText(t); bkText = ""; bkDone("コピーしたよ。LINEやメモにはりつけて、とっておこう"); }
  catch (e) { bkText = t; bkMsg = "{下|した}の{文字|もじ}をぜんぶえらんで、コピーしてね"; render(); }
}
function askRestore(text) {
  const o = parseBackup(text);
  if (!o) { pendingRestore = null; bkMsg = "バックアップの{形|かたち}になっていないよ。もう{一度|いちど}たしかめてね"; render(); return; }
  pendingRestore = o; bkMsg = ""; render();
  const el = document.getElementById("bk-confirm"); if (el) el.scrollIntoView({ block: "center" });
}

async function handlePhoto(file) {
  photoWork = { state: "busy" }; render();
  let raw = null;
  try {
    const c = await fileToCanvas(file, 720);
    raw = shrink(c, 520, "image/jpeg", 0.85);
    const cut = await segmentCut(c);
    photoWork = { state: "ready", raw, cut };
  } catch (e) {
    photoWork = raw ? { state: "ready", raw, cut: null, msg: "{切|き}り{抜|ぬ}きがうまくいかなかったよ。{切|き}り{抜|ぬ}かないで{使|つか}うこともできるよ" }
                    : { state: "error", msg: "{写真|しゃしん}を{読|よ}みこめなかったよ。ちがう{写真|しゃしん}でためしてね" };
  }
  render();
}

/* ---------- 道具 ---------- */
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const plain = s => String(s ?? "").replace(/\{([^|{}]+)\|([^{}]+)\}/g, "$1");
// 中学生版は、ふりがなを外して、ひらがなで書いていた言葉を漢字にする
const JH_WORDS = [["おうちの人に見せよう", "家族に見せよう"], ["おうちの人へ", "保護者の方へ"], ["おうちのごほうび", "ごほうび"], ["おうちの人", "家族"],
  ["れんしゅう", "練習"], ["きろく", "記録"], ["しあい", "試合"], ["もくひょう", "目標"], ["なまえ", "名前"], ["ぜんぶ", "全部"],
  ["ふりかえり", "振り返り"], ["ほぞん", "保存"], ["つかいかた", "使い方"], ["ちゅうい", "注意"], ["えらんで", "選んで"], ["えらぶ", "選ぶ"],
  ["こんげつ", "今月"], ["ことし", "今年"], ["じぶんたち", "自分たち"], ["じぶん", "自分"], ["さいご", "最後"], ["たんい", "単位"],
  ["きょう", "今日"], ["つぎ", "次"], ["ためす", "試す"], ["あした", "明日"], ["いちばん", "一番"], ["まだないよ", "まだありません"]];
const jw = s => { for (const [a, b] of JH_WORDS) s = s.split(a).join(b); return s; };
const R = JH ? s => esc(jw(plain(s))) : s => esc(s).replace(/\{([^|{}]+)\|([^{}]+)\}/g, "<ruby>$1<rt>$2</rt></ruby>");
const pad = n => String(n).padStart(2, "0");
const ymd = (d = new Date()) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const addDays = (s, n) => { const [y, m, d] = s.split("-").map(Number); return ymd(new Date(y, m - 1, d + n)); };
const WD = ["日", "月", "火", "水", "木", "金", "土"];
const jpDate = s => { const [y, m, d] = s.split("-").map(Number); const w = new Date(y, m - 1, d).getDay(); return `${m}{月|がつ}${d}{日|にち}（${WD[w]}）`; };
const uid = () => Math.random().toString(36).slice(2, 9);
const CHECK = '<svg viewBox="0 0 24 24" fill="none" stroke="#06210f" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
const CHECKW = CHECK.replace("#06210f", "#fff");

/* ---------- ぜんぶの数字を記録から計算する ---------- */
// 週は月曜はじまり
const weekStart = s => { const [y, m, d] = s.split("-").map(Number); const w = (new Date(y, m - 1, d).getDay() + 6) % 7; return addDays(s, -w); };
const weekNo = s => { const [y, m, d] = s.split("-").map(Number); return Math.floor(Date.UTC(y, m - 1, d) / 864e5 / 7); };
const isSwing = name => plain(name) === "素振り";
// その日の練習でたまったEXP（練習・ぜんぶクリア・チャレンジ）
const dayExp = L => { let e = 0; for (const id in (L.done || {})) e += L.done[id].exp || 0; return e + (L.clear ? CLEAR_BONUS : 0) + (L.ch || 0); };

/* ---------- 日替わりチャレンジ（日付で決まるので、その日はずっと同じお題） ---------- */
function hashStr(s) { let h = 2166136261; for (const ch of s) { h ^= ch.charCodeAt(0); h = Math.imul(h, 16777619); } return h >>> 0; }
function challengeFor(d) {
  const act = S.menu.filter(m => m.on); if (!act.length) return null;
  const h = hashStr("ch" + d), sw = act.find(m => m.var), kind = h % 3;
  if (kind === 0 && sw) { const n = [100, 150, 200, 250, 300][(h >>> 4) % 5]; return { kind: "swing", id: sw.id, n, bonus: 30, text: `{素振|すぶ}り${n}{回|かい}{以上|いじょう}` }; }
  if (kind === 1 || act.length === 1) return { kind: "all", bonus: 30, text: "メニューをぜんぶクリア" };
  const others = act.filter(m => !m.var), pool = others.length ? others : act, m = pool[(h >>> 6) % pool.length];
  return { kind: "item", id: m.id, bonus: 20, text: `${m.name}をやる` };
}
function chDone(ch, L) {
  if (!ch || !L || !L.done) return false;
  if (ch.kind === "swing") return !!L.done[ch.id] && (L.done[ch.id].count || 0) >= ch.n;
  if (ch.kind === "all") return !!L.clear;
  return !!L.done[ch.id];
}
// きょうの「ぜんぶクリア」と「チャレンジ達成」をつけなおす
function updateDay(d) {
  const L = S.logs[d]; if (!L) return;
  const act = S.menu.filter(x => x.on);
  L.clear = act.length > 0 && act.every(x => L.done[x.id]);
  const ch = challengeFor(d);
  if (chDone(ch, L)) L.ch = ch.bonus; else delete L.ch;
}

const dayNum = s => { const [y, m, d] = s.split("-").map(Number); return Math.floor(Date.UTC(y, m - 1, d) / 864e5); };
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function permOf(n, seed) { const a = [...Array(n).keys()], r = rng(seed); for (let i = n - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

const QUIZ_ORDER = permOf(QUIZ.length, 20261118);
function quizFor(d) {
  const i = QUIZ_ORDER[dayNum(d) % QUIZ.length], [q, ch, ex] = QUIZ[i];
  const order = permOf(3, hashStr("q" + d));   // 正解の位置を日ごとに入れかえる
  return { i, q, ex, choices: order.map(k => ch[k]), answer: ch[0] };
}

/* ---------- 週ボス ---------- */
const BOSS_HP = 500, BOSS_EXP = 100;
const BOSSES = ["{剛速球|ごうそっきゅう}マシーン", "{鉄壁|てっぺき}キャッチャー", "{魔球|まきゅう}ピッチャー", "{雷|かみなり}スラッガー", "{影|かげ}の{盗塁王|とうるいおう}", "{巨人|きょじん}ホームランキング", "{竜巻|たつまき}ショートストップ", "{氷|こおり}のサウスポー"];
const bossOf = ws => BOSSES[weekNo(ws) % BOSSES.length];

/* ---------- 休養日 ---------- */
const REST_PER_WEEK = 1;
const restUsedInWeek = ws => Object.keys(S.rest || {}).filter(d => weekStart(d) === ws).length;

function compute() {
  let exp = 0; const ab = { meet: 0, power: 0, speed: 0, arm: 0, def: 0 }; const totals = {};
  const days = Object.keys(S.logs).filter(d => Object.keys(S.logs[d].done || {}).length).sort();
  let swing = 0, clears = 0, chCount = 0; const dmg = {};
  for (const d of days) {
    const L = S.logs[d];
    for (const id in L.done) {
      const e = L.done[id]; exp += e.exp || 0;
      for (const k in (e.ab || {})) ab[k] = (ab[k] || 0) + e.ab[k];
      const t = totals[e.name] || (totals[e.name] = { name: e.name, unit: e.unit, count: 0, times: 0 });
      t.count += e.count || 0; t.times++;
      if (isSwing(e.name)) swing += e.count || 0;
    }
    if (L.clear) { exp += CLEAR_BONUS; clears++; }
    if (L.ch) { exp += L.ch; chCount++; }
    const ws = weekStart(d); dmg[ws] = (dmg[ws] || 0) + dayExp(L);
  }
  // 連続日数（休養日も「続いている」に数える）
  const sdays = [...new Set([...days, ...Object.keys(S.rest || {})])].sort();
  let run = 0, prev = null, best = 0;
  for (const d of sdays) {
    run = (prev && addDays(prev, 1) === d) ? run + 1 : 1; prev = d;
    best = Math.max(best, run); exp += streakBonus(run);
  }
  const today = ymd();
  const cur = sdays.length && (prev === today || prev === addDays(today, -1)) ? run : 0;
  const bossWins = JH ? 0 : Object.values(dmg).filter(x => x >= BOSS_HP).length;   // 中学生版は週ボスなし
  const bkWeeks = new Set(S.bkDays.map(weekStart)).size;
  exp += bkWeeks * BK_EXP;
  exp += bossWins * BOSS_EXP;
  let hits = 0, hr = 0, maxHits = 0;
  let pitchGames = 0, pk = 0;
  for (const g of S.games) { const h = hitsOf(g.ab); hits += h; hr += g.ab.hr || 0; maxHits = Math.max(maxHits, h); if (g.p) { pitchGames++; pk += g.p.k || 0; } }
  exp += S.games.length * GAME_EXP;
  exp += S.tp.length * TEAM_EXP;
  const steps = S.goals.steps.filter(s => s.done).length;
  exp += steps * STEP_EXP;
  const reviews = Object.keys(S.reviews).length;
  exp += reviews * REVIEW_EXP;
  const quizOk = Object.values(S.quiz || {}).filter(x => x.ok).length;
  exp += quizOk * QUIZ_EXP;
  const bodyDays = new Set((S.body || []).map(b => b.date)).size;
  exp += bodyDays * BODY_EXP;
  let lv = 1, rest = exp;
  while (lv < MAX_LV && rest >= needFor(lv)) { rest -= needFor(lv); lv++; }
  const c = { exp, ab, totals, days: days.length, best, cur, lv, into: lv >= MAX_LV ? 1 : rest, need: lv >= MAX_LV ? 1 : needFor(lv),
    swing, clears, chCount, dmg, bossWins, games: S.games.length, hits, hr, maxHits, steps, reviews, quizOk, pitchGames, pk, bodyDays, tps: S.tp.length, bks: S.bkDays.length };
  c.badges = BADGES.filter(b => b.ok(c)).map(b => b.id);
  return c;
}

function todayStats() {
  const act = S.menu.filter(m => m.on); const L = S.logs[ymd()] || { done: {} };
  const done = act.filter(m => L.done && L.done[m.id]).length;
  return { done, total: act.length, pct: act.length ? Math.round(done / act.length * 100) : 0 };
}

const TIMER_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l3 2M9 2h6"/></svg>';

// 今週のボス（練習でためたEXPがダメージになる）
function weekCard(c) {
  const ws = weekStart(ymd()), today = ymd(), pws = addDays(ws, -7);
  const did = d => !!(S.logs[d] && Object.keys(S.logs[d].done || {}).length);
  let days = 0, pdays = 0;
  for (let i = 0; i < 7; i++) { if (did(addDays(ws, i))) days++; if (did(addDays(pws, i))) pdays++; }
  const cells = Array.from({ length: 7 }, (_, i) => { const d = addDays(ws, i);
    return `<span class="${did(d) ? "on" : S.rest[d] ? "rest" : ""} ${d === today ? "now" : ""} ${d > today ? "fut" : ""}"><small>${WD[(i + 1) % 7]}</small><i></i></span>`; }).join("");
  return `<section class="wk">
    <div class="boss-top"><span class="eyebrow">THIS WEEK</span><span class="hint">今週の練習</span></div>
    <div class="wk-days">${cells}</div>
    <div class="wk-sum"><b>${days}</b>日・<b>${(c.dmg[ws] || 0).toLocaleString()}</b> EXP<span class="hint">先週は ${pdays}日・${(c.dmg[pws] || 0).toLocaleString()} EXP</span></div>
  </section>`;
}
function bossCard(c, full) {
  if (JH) return weekCard(c);
  const ws = weekStart(ymd()), d = c.dmg[ws] || 0, left = Math.max(0, BOSS_HP - d), pct = Math.round(left / BOSS_HP * 100);
  const won = left === 0;
  return `<section class="boss ${won ? "won" : ""}">
    <div class="boss-top"><span class="eyebrow">WEEKLY BOSS</span><span class="hint">${R("{日曜|にちよう}まで")}</span></div>
    <div class="boss-name"><span>${R(bossOf(ws))}</span>${won ? `<span class="chip gold">${R("{撃破|げきは}！")}</span>` : ""}</div>
    <div class="hp"><i style="width:${pct}%"></i><span>HP ${left}/${BOSS_HP}</span></div>
    ${full ? `<div class="hint">${R(won ? `たおした！ +${BOSS_EXP} EXP。{来週|らいしゅう}はべつのボスが{来|く}るよ` : `{練習|れんしゅう}でためたEXPがダメージになるよ。たおすと +${BOSS_EXP} EXP`)}</div>` : ""}
  </section>`;
}
// ホームに出す、おうちのごほうび
function rewardCard(c) {
  if (JH) return "";
  const list = (S.rewards || []).filter(r => !r.got);
  if (!list.length) return "";
  const rows = list.map(r => ({ r, p: rwProg(r, c) })).sort((a, b) => (b.p / b.r.target) - (a.p / a.r.target)).slice(0, 3);
  return `<section class="panel reward">
    <div class="hint" style="margin-bottom:8px">${R("おうちのごほうび")}</div>
    ${rows.map(({ r, p }) => { const ok = p >= r.target, pct = Math.min(100, Math.round(p / r.target * 100));
      return `<div class="rw ${ok ? "ok" : ""}"><div class="rw-top"><b>${esc(r.text)}</b><span>${R(rwCond(r))}</span></div>
        <div class="bar"><i style="width:${pct}%"></i></div>
        <div class="hint">${ok ? R("{達成|たっせい}！おうちの{人|ひと}に{見|み}せよう") : R(`あと ${(r.target - p).toLocaleString()}`)}</div></div>`; }).join("")}

}

function vRecord(c) {
  const today = ymd();
  // レーダー
  const cx = 150, cy = 140, r = 95;

/* ---------- カレンダー（自主練・チーム練習・試合を1つに） ---------- */
let calYm = null, calSel = null;

function dayInfo(d) {
  const L = S.logs[d], n = L ? Object.keys(L.done || {}).length : 0;
  return { self: n, clear: !!(L && L.clear), rest: !!S.rest[d], tp: S.tp.filter(p => p.date === d), games: S.games.filter(g => g.date === d), tday: S.tday[d], note: (S.notes || {})[d] };
}
function calendarSection() {
  const today = ymd(), ym = calYm || today.slice(0, 7), [y, m] = ym.split("-").map(Number);
  const first = new Date(y, m - 1, 1).getDay(), n = daysIn(ym);
  const sel = calSel && calSel.startsWith(ym) ? calSel : (today.startsWith(ym) ? today : null);
  let cells = WD.map((w, i) => `<b class="cal-wd ${i === 0 ? "sun" : i === 6 ? "sat" : ""}">${w}</b>`).join("");
  for (let i = 0; i < first; i++) cells += `<span class="cal-d empty"></span>`;

  for (let k = 1; k <= n; k++) {
    const d = `${ym}-${pad(k)}`, f = dayInfo(d);
    if (f.self) sDays++; tps += f.tp.length; gms += f.games.length;
    const mk = (f.self ? `<i class="mk self ${f.clear ? "clear" : ""}"></i>` : f.rest ? `<i class="mk rest"></i>` : "")
             + (f.tp.length ? `<i class="mk tp"></i>` : "") + (f.games.length ? `<i class="mk gm"></i>` : "");
    cells += `<button class="cal-d ${d === sel ? "sel" : ""} ${d === today ? "now" : ""} ${d > today ? "fut" : ""}" data-act="calSel" data-v="${d}" aria-label="${m}月${k}日"><span class="n">${k}</span><span class="mks">${mk}</span></button>`;
  }

    <div class="panel">
      <div class="cal-nav"><button data-act="calMove" data-v="-1" aria-label="前の月">‹</button><b>${R(ymLabel(ym))}</b><button data-act="calMove" data-v="1" aria-label="次の月" ${ym >= today.slice(0, 7) ? "disabled" : ""}>›</button></div>
      <div class="cal">${cells}</div>
      <div class="cal-legend"><span><i class="mk self"></i>${R("{自主練|じしゅれん}")}</span><span><i class="mk self clear"></i>${R("ぜんぶクリア")}</span><span><i class="mk tp"></i>${R("チーム{練習|れんしゅう}")}</span><span><i class="mk gm"></i>${R("{試合|しあい}")}</span><span><i class="mk rest"></i>${R("{休養日|きゅうようび}")}</span></div>
      <div class="cal-sum">${R(`{自主練|じしゅれん} ${sDays}{日|にち}・チーム{練習|れんしゅう} ${tps}{回|かい}・{試合|しあい} ${gms}`)}</div>

}
function dayDetail(d) {
  const f = dayInfo(d), L = S.logs[d]; let h = "";

  if (f.note) h += `<div class="dd note"><small>練習ノート</small>${esc(f.note)}</div>`;

function bodySection() {
  const list = [...(S.body || [])].sort((a, b) => a.date.localeCompare(b.date));

  const pts = list.filter(b => b[k] !== "" && b[k] != null && !isNaN(b[k])).map(b => ({ d: b.date, v: Number(b[k]) }));

      <div class="body-diff ${good ? "up" : diff ? "down" : ""}">はじめの記録から ${diff > 0 ? "+" : ""}${Math.round(diff * 100) / 100}${unit}${low && diff < 0 ? "（速くなった）" : ""}</div>`;

// 期間の練習の数字（先月とくらべる用）
function periodStats(from, to) {
  let days = 0, swing = 0, exp = 0, clears = 0;
  for (const d in S.logs) {
    if (d < from || d > to) continue; const L = S.logs[d]; if (!Object.keys(L.done || {}).length) continue;
    days++; exp += dayExp(L); if (L.clear) clears++;
    for (const id in L.done) if (isSwing(L.done[id].name)) swing += L.done[id].count || 0;
  }
  return { days, swing, exp, clears };
}
function compareSection() {
  const today = ymd(), ym = today.slice(0, 7), dn = Number(today.slice(8)), pym = prevYm(ym);
  const now = periodStats(ym + "-01", today), old = periodStats(pym + "-01", `${pym}-${pad(Math.min(dn, daysIn(pym)))}`);
  const row = (label, a, b, unit) => { const d = a - b;
    return `<div><span>${R(label)}</span><b>${a.toLocaleString()}</b><span class="old">${b.toLocaleString()}</span><span class="${d > 0 ? "up" : "down"}">${d > 0 ? "▲" + d.toLocaleString() : d < 0 ? "▼" + (-d).toLocaleString() : "±0"}</span></div>`; };

}

const BAT = [["h", "ヒット"], ["d2", "ツーベース"], ["d3", "スリーベース"], ["hr", "ホームラン"], ["bb", "フォアボール・デッドボール"], ["ks", "{空振|からぶ}り{三振|さんしん}"], ["kl", "{見逃|みのが}し{三振|さんしん}"], ["out", "アウト（ゴロ・フライ）"], ["sac", "バント・{犠牲|ぎせい}フライ"]];

/* ---------- 月のふりかえり ---------- */
const GRADES = [["a", "◎ できた"], ["b", "○ もう{少|すこ}し"], ["c", "△ できなかった"]];
let rvDraft = {};
const ymLabel = ym => { const [y, m] = ym.split("-").map(Number); return `${y}{年|ねん}${m}{月|がつ}`; };
const prevYm = ym => { const [y, m] = ym.split("-").map(Number); return m === 1 ? `${y - 1}-12` : `${y}-${pad(m - 1)}`; };
const daysIn = ym => { const [y, m] = ym.split("-").map(Number); return new Date(y, m, 0).getDate(); };
// ふりかえりができる月：はじめた月〜先月。今月も、のこり3日になったらできる
function reviewableMonths() {
  const today = ymd(), cur = today.slice(0, 7), first = (S.started || today).slice(0, 7);
  const out = [];
  if (Number(today.slice(8)) >= daysIn(cur) - 2) out.push(cur);
  for (let ym = prevYm(cur); ym >= first; ym = prevYm(ym)) out.push(ym);
  return out;
}
const pendingReviews = () => reviewableMonths().filter(ym => !S.reviews[ym]);
function monthStats(ym) {
  const days = Object.keys(S.logs).filter(d => d.startsWith(ym) && Object.keys(S.logs[d].done || {}).length);
  let exp = 0, swing = 0, clear = 0;
  for (const d of days) { const L = S.logs[d]; if (L.clear) { clear++; exp += CLEAR_BONUS; }
    for (const id in L.done) { const e = L.done[id]; exp += e.exp || 0; if (plain(e.name) === "素振り") swing += e.count || 0; } }
  const games = S.games.filter(g => g.date.startsWith(ym));
  let h = 0, ab = 0; for (const g of games) { h += hitsOf(g.ab); ab += atBats(g.ab); }
  exp += games.length * GAME_EXP;
  const steps = S.goals.steps.filter(s => s.done && (s.doneDate || "").startsWith(ym)).length;
  exp += steps * STEP_EXP;
  return { days: days.length, dim: daysIn(ym), clear, swing, games: games.length, avg: ab ? (h / ab).toFixed(3).replace(/^0/, "") : "---", steps, exp };
}
function statLine(ym) {
  const s = monthStats(ym);
  return `<div class="mstats">
    <div><small>${R("{練習|れんしゅう}した{日|ひ}")}</small><b>${s.days}<span>/${s.dim}</span></b></div>
    <div><small>${R("ぜんぶクリア")}</small><b>${s.clear}<span>${R("{日|にち}")}</span></b></div>
    <div><small>${R("{素振|すぶ}り")}</small><b>${s.swing.toLocaleString()}<span>${R("{回|かい}")}</span></b></div>
    <div><small>${R("{試合|しあい}")}</small><b>${s.games}<span>${s.games ? R(" {打率|だりつ}") + s.avg : ""}</span></b></div>
    <div><small>${R("ステップ{達成|たっせい}")}</small><b>${s.steps}</b></div>
    <div><small>${R("ためたEXP")}</small><b>${s.exp.toLocaleString()}</b></div>
  </div>`;
}

  return `<h2 class="sec" id="reviews">${R("{月|つき}のふりかえり")}<small>${R(`+${REVIEW_EXP} EXP`)}</small></h2>

function vHelp() {
  const P = s => `<p>${R(s)}</p>`, H = s => `<h3>${R(s)}</h3>`, L = a => `<ul>${a.map(s => `<li>${R(s)}</li>`).join("")}</ul>`;
  const sec = (title, body, open) => `<details ${open ? "open" : ""}><summary><span>${R(title)}</span></summary><div class="body">${body}</div></details>`;
  const lvRows = TITLES.map((t, i) => `<div><span>${R(t)}</span><em>Lv.${i === 0 ? 1 : i * 5}〜</em></div>`).join("");
  const menuRows = S.menu.filter(m => m.on).map(m => `<div><span>${R(m.name)}</span><em>${m.var ? "+15〜70" : "+" + m.exp}</em></div>`).join("");
  return `<div class="stack help-doc">
    <h2 class="sec" style="margin-top:0">${R("つかいかた・ちゅうい")}</h2>
    ${sec("このアプリでできること", P("{毎日|まいにち}の{自主練|じしゅれん}をチェックすると、EXP（{経験値|けいけんち}）がたまってレベルが{上|あ}がるよ。レベルが{上|あ}がると「{新人|しんじん}{選手|せんしゅ}」から「スーパースター」まで{称号|しょうごう}がかわっていく。")
      + P("{試合|しあい}の{記録|きろく}や、{夢|ゆめ}・{目標|もくひょう}も{書|か}いておけるよ。"), true)}
    ${sec("{画面|がめん}ごとのつかいかた",
      H("ホーム") + P("{選手|せんしゅ}カードと、きょうの{達成率|たっせいりつ}、{何日|なんにち}{続|つづ}けているかが{見|み}られる。")
      + H("れんしゅう") + P("やった{練習|れんしゅう}をタップしてチェック。{素振|すぶ}りは、やった{回数|かいすう}をえらんでからチェックしてね（10〜${(S.menu.find(m => m.var) || { max: 600 }).max}{回|かい}）。いちばん{上|うえ}には「いまの{課題|かだい}」が{出|で}るよ。") + H("{課題|かだい}のつなげかた") + P("{自主練|じしゅれん}で{課題|かだい}を{練習|れんしゅう}する → チーム{練習|れんしゅう}で{実戦|じっせん}に{近|ちか}い{形|かたち}でためす → {試合|しあい}でためす → また{新|あたら}しい{課題|かだい}が{見|み}つかる。この{流|なが}れを{記録|きろく}でつなげよう。チーム{練習|れんしゅう}と{試合|しあい}では、{監督|かんとく}・コーチから{指導|しどう}を{受|う}けたことも{書|か}いておけるよ。") + P("チーム{練習|れんしゅう}と{試合|しあい}の{記録|きろく}に「つぎの{課題|かだい}」を{書|か}くと、いちばん{新|あたら}しいものが「いまの{課題|かだい}」になって、れんしゅう{画面|がめん}に{出|で}るよ。チーム{練習|れんしゅう}は、れんしゅう{画面|がめん}の「チーム{練習|れんしゅう}を{記録|きろく}する」から{書|か}けるよ。")
      + H("きろく") + P("カレンダー（{自主練|じしゅれん}・チーム{練習|れんしゅう}・{試合|しあい}が1つに{出|で}る。{日|ひ}にちをおすと、その{日|ひ}の{中身|なかみ}が{見|み}られる）、{能力|のうりょく}のグラフ、これまでの{合計|ごうけい}{回数|かいすう}が{見|み}られる。" + (JH ? "身長・体重・50m走・遠投を記録すると、伸びがグラフで見られる。練習ノートもここに並ぶ。" : ""))
      + H("しあい") + P("{試合|しあい}が{終|お}わったら{記録|きろく}しよう。{打席|だせき}ごとに＋をおすと、{打率|だりつ}などを{自動|じどう}で{計算|けいさん}するよ。ピッチャーで{投|な}げた{日|ひ}は「ピッチャーで{投|な}げた」をおすと、{投球回|とうきゅうかい}・{奪三振|だつさんしん}などを{記録|きろく}できて、{防御率|ぼうぎょりつ}も{計算|けいさん}するよ。")
      + H("もくひょう") + P("{夢|ゆめ}→ことし→こんげつ→スモールステップの{順|じゅん}に{書|か}こう。{月|つき}が{終|お}わったら「{月|つき}のふりかえり」もしよう。")
      + H("{右上|みぎうえ}の{歯車|はぐるま}") + P("{名前|なまえ}・{背番号|せばんごう}・ポジション、{写真|しゃしん}、{練習|れんしゅう}メニュー、" + (JH ? "" : "おうちのごほうび、") + "{記録|きろく}の{保存|ほぞん}（バックアップ）、{音|おと}をかえられる。"))}
    ${sec("EXPのもらいかた",
      `<div class="rows">${menuRows}
        <div><span>${R("きょうのメニューをぜんぶクリア")}</span><em>+${CLEAR_BONUS}</em></div>
        <div><span>${R("3{日|か}・7{日|か}・14{日|か}{連続|れんぞく}")}</span><em>+30 / +70 / +100</em></div>
        <div><span>${R("30{日|にち}{連続|れんぞく}ごと")}</span><em>+200</em></div>
        <div><span>${R("{試合|しあい}を{記録|きろく}")}</span><em>+${GAME_EXP}</em></div>
        <div><span>${R("チーム{練習|れんしゅう}を{記録|きろく}")}</span><em>+${TEAM_EXP}</em></div>
        <div><span>${R("スモールステップを{達成|たっせい}")}</span><em>+${STEP_EXP}</em></div>
        <div><span>${R("{月|つき}のふりかえり")}</span><em>+${REVIEW_EXP}</em></div>
        <div><span>${R("{日替|ひが}わりチャレンジ")}</span><em>+20〜30</em></div>
        ${JH ? "" : `<div><span>${R("{週|しゅう}ボスをたおす")}</span><em>+${BOSS_EXP}</em></div>`}
        <div><span>${R("{記録|きろく}を{保存|ほぞん}（{週|しゅう}1{回|かい}）")}</span><em>+${BK_EXP}</em></div>
        <div><span>${R("{野球|やきゅう}クイズに{正解|せいかい}")}</span><em>+${QUIZ_EXP}</em></div>
        ${JH ? `<div><span>体と数字の記録（1日1回）</span><em>+${BODY_EXP}</em></div>` : ""}</div>`
      + P("{素振|すぶ}りは{回数|かいすう}が{多|おお}いほどEXPがふえる（50{回|かい}で+15、600{回|かい}で+70）。"))}
    ${sec("レベルと{称号|しょうごう}", `<div class="rows">${lvRows}</div>` + P("{練習|れんしゅう}すると、ミート・パワー・{走力|そうりょく}・{肩|かた}・{守備|しゅび}の{能力|のうりょく}もG→Sに{育|そだ}つよ。"))}
    ${sec("{毎日|まいにち}がもっと{楽|たの}しくなるしくみ",
      H("{野球|やきゅう}クイズ") + P(`れんしゅう{画面|がめん}の{下|した}に、1{日|にち}1{問|もん}のクイズが{出|で}るよ。{答|こた}えられるのは1{回|かい}だけ。{正解|せいかい}で +${QUIZ_EXP} EXP。`)
      + H("きょうのことば") + P("{野球|やきゅう}{選手|せんしゅ}などの{名言|めいげん}や、がんばる{力|ちから}になることわざが{毎日|まいにち}かわるよ。")
      + H("{日替|ひが}わりチャレンジ") + P("れんしゅう{画面|がめん}の{上|うえ}に、{毎日|まいにち}ちがうお{題|だい}が{出|で}るよ。できたらボーナスEXP！")
      + (JH ? H("今週の練習") + P("ホームと練習の画面に、月曜から日曜までに練習した日と、ためたEXPが出る。先週とくらべて、ペースをつかもう。") : H("{週|しゅう}ボス") + P("{月曜|げつよう}から{日曜|にちよう}までに、{練習|れんしゅう}でためたEXPがボスへのダメージになる。HPを0にしたら +100 EXP。{毎週|まいしゅう}ちがうボスが{来|く}るよ。"))
      + H("{休養日|きゅうようび}チケット") + P("{週|しゅう}に1{回|かい}だけ「きょうは{休養日|きゅうようび}」にできる。{休|やす}んでも{連続|れんぞく}{日数|にっすう}は{切|き}れないよ。{体|からだ}を{休|やす}めるのも{大事|だいじ}な{練習|れんしゅう}！")
      + H("{練習|れんしゅう}のおとも") + P("メニューの{右|みぎ}のボタンをおすと、{回数|かいすう}を{数|かぞ}えるカウンターや、ストレッチのタイマーが{使|つか}える。{終|お}わるとそのままチェックが{付|つ}くよ。")
      + H("バッジ") + P("{連続|れんぞく}{日数|にっすう}や{素振|すぶ}りの{合計|ごうけい}、{初|はつ}ヒットなどでバッジがもらえる。「きろく」のいちばん{下|した}で{集|あつ}めたバッジが{見|み}られるよ。")
      + (JH ? "" : H("おうちのごほうび") + P("{歯車|はぐるま}の「おうちのごほうび」で、おうちの{人|ひと}といっしょにごほうびと{条件|じょうけん}を{決|き}めよう。ホームに「あと{何|なん}こ」が{出|で}るよ。"))
      + H("カードを{画像|がぞう}にする") + P("ホームのボタンで、{選手|せんしゅ}カードを{画像|がぞう}にできる。LINEで{家族|かぞく}やチームメイトに{見|み}せよう。")
      + H("{先月|せんげつ}の{自分|じぶん}とくらべる") + P("「きろく」で、{今月|こんげつ}と{先月|せんげつ}を{同|おな}じ{日|ひ}にちまでくらべられるよ。"))}
    ${sec("{写真|しゃしん}を{入|い}れるには",
      P("{歯車|はぐるま}→「{選手|せんしゅ}の{写真|しゃしん}」→「{写真|しゃしん}をえらぶ」。{背景|はいけい}は{自動|じどう}で{切|き}り{抜|ぬ}くよ。")
      + L(["{立|た}っていて、{体|からだ}ぜんぶか{上半身|じょうはんしん}がはっきり{写|うつ}った{写真|しゃしん}がおすすめ", "{人|ひと}がたくさん{写|うつ}っている{写真|しゃしん}は、うまく{切|き}り{抜|ぬ}けないことがある", "{切|き}り{抜|ぬ}きはスマホの{中|なか}でするので、{写真|しゃしん}は{外|そと}に{送|おく}られない"]))}
    ${sec("{記録|きろく}について（だいじ）",
      `<div class="warn">${R("{記録|きろく}は、このスマホの{中|なか}だけにほぞんされているよ。")}</div>`
      + L(["いつもホーム{画面|がめん}のアイコンから{開|ひら}こう。ブラウザ（SafariやChrome）から{開|ひら}くと、{記録|きろく}が{別|べつ}になってしまう",
           "ホーム{画面|がめん}のアイコンを{消|け}すと、{記録|きろく}も{消|き}えることがある",
           "Safariの「{履歴|りれき}とWebサイトデータを{消去|しょうきょ}」をすると{記録|きろく}が{消|き}える",
           "スマホをかえる{時|とき}やアイコンを{置|お}きなおす{時|とき}は、{先|さき}に{歯車|はぐるま}の「{記録|きろく}のバックアップ」をとっておこう。あとで「バックアップからもどす」で{元|もと}にもどせるよ"]))}
    ${sec("アプリが{新|あたら}しくならない{時|とき}",
      L(["{画面|がめん}の{下|した}から{上|うえ}にスワイプして、このアプリを{上|うえ}にはじいて{閉|と}じてから、もう{一度|いちど}{開|ひら}く",
         "{新|あたら}しくなってから10{分|ぷん}くらいは、{前|まえ}のままのことがある",
         "{記録|きろく}は、アプリが{新|あたら}しくなっても{消|き}えない"]))}
    ${sec("おうちの{人|ひと}へ",
      P("{記録|きろく}はお{子|こ}さんのスマホのブラウザの{中|なか}だけに{保存|ほぞん}され、インターネット{上|じょう}には{送|おく}られません。{写真|しゃしん}の{切|き}り{抜|ぬ}きもスマホの{中|なか}で{行|おこな}います（はじめての{時|とき}だけ、{切|き}り{抜|ぬ}き{用|よう}の{部品|ぶひん}をダウンロードします）。")
      + P("ほかの{人|ひと}のスマホからは{記録|きろく}を{見|み}られません。チームメイトもURLを{開|ひら}けば、それぞれのスマホで{使|つか}えます。"))}
    <button class="btn sub" data-act="tab" data-v="home">${R("ホームにもどる")}</button>
  </div>`;
}

function backupSection() {
  const last = S.lastBackup ? R(`さいごのバックアップ：${jpDate(S.lastBackup)}`) : R("まだバックアップしていないよ");
  let confirm = "";
  if (pendingRestore) {
    const b = backupSummary(pendingRestore);
    confirm = `<div class="warn-box" id="bk-confirm">
      <div style="font-weight:800">${R("このバックアップにもどす？")}</div>
      <div class="hint">${b.at ? R(jpDate(b.at)) + "・" : ""}${esc(b.name || "")} Lv.${b.lv}・${R(`{練習|れんしゅう}した{日|ひ} ${b.days}`)}${b.photo ? R("・{写真|しゃしん}あり") : ""}</div>
      <div style="font-weight:700">${R("いまの{記録|きろく}は、このバックアップに{入|い}れかわるよ。")}</div>
      <div class="row2"><button class="btn sub" data-act="cancelRestore">${R("やめる")}</button><button class="btn del-btn" data-act="doRestore">${R("もどす")}</button></div>
    </div>`;
  }
  return `<div class="panel form">
    <div class="hint">${R(`{記録|きろく}はこのスマホの{中|なか}だけにあるよ。{週|しゅう}に1{回|かい}は{保存|ほぞん}しておこう（{週|しゅう}1{回|かい} +${BK_EXP} EXP）。スマホをかえる{時|とき}や、アイコンを{置|お}きなおす{前|まえ}は{必|かなら}ず{保存|ほぞん}してね。`)}</div>
    <div class="hint" style="color:var(--light)">${last}</div>
    ${bkMsg ? `<div class="bk-msg">${R(bkMsg)}</div>` : ""}
    <button class="btn" data-act="makeBackup">${R("ファイルにする（{写真|しゃしん}こみ）")}</button>
    <button class="btn sub" data-act="copyBackup">${R("{文字|もじ}でコピーする（{写真|しゃしん}なし）")}</button>
    ${bkText ? `<textarea id="bk-text" class="bk-text" readonly>${esc(bkText)}</textarea>` : ""}
    <div style="font-weight:800;margin-top:6px">${R("バックアップからもどす")}</div>
    <label class="btn sub" for="bk-file">${R("ファイルをえらんでもどす")}</label>
    <input type="file" id="bk-file" accept=".json,application/json,text/plain" class="vh" tabindex="-1" aria-hidden="true">
    <div class="field"><label for="bk-paste">${R("コピーした{文字|もじ}をはりつけてもどす")}</label><textarea id="bk-paste" placeholder="${JH ? "ここに貼り付ける" : "ここにはりつける"}"></textarea></div>
    <button class="btn sub" data-act="pasteRestore">${R("はりつけた{文字|もじ}でもどす")}</button>
    ${confirm}
  </div>`;
}

function vSettings(c) {

  return `<div class="stack">

    <h2 class="sec">${R("{選手|せんしゅ}の{写真|しゃしん}")}</h2>
    ${photoSection()}
    <input type="file" id="photo-in" accept="image/*" class="vh" tabindex="-1" aria-hidden="true">
    <h2 class="sec">${R("{練習|れんしゅう}メニュー")}<small>${R("オフにすると{今日|きょう}から{出|で}なくなる")}</small></h2>
    <div class="panel">${S.menu.map(m => `<div class="mrow">

        <button class="sw ${m.on ? "on" : ""}" data-act="swMenu" data-v="${m.id}" aria-label="オンオフ" aria-pressed="${!!m.on}"></button></div>`).join("")}</div>
    <div class="panel form">

      <div class="field"><label for="nm-name">${R("なまえ")}</label><input id="nm-name" maxlength="20" placeholder="れい：ティーバッティング"></div>
      <div class="row2">
        <div class="field"><label for="nm-count">${R("{回数|かいすう}")}</label><input id="nm-count" type="number" inputmode="numeric" min="1" value="10"></div>
        <div class="field"><label for="nm-unit">${R("たんい")}</label><select id="nm-unit"><option>回</option><option>本</option><option>球</option><option>分</option></select></div>
      </div>
      <div class="row2">
        <div class="field"><label for="nm-exp">EXP</label><select id="nm-exp"><option>10</option><option selected>15</option><option>20</option><option>30</option></select></div>
        <div class="field"><label for="nm-ab">${R("{伸|の}びる{能力|のうりょく}")}</label><select id="nm-ab">${abOpts.map(([k, n]) => `<option value="${k}">${n}</option>`).join("")}</select></div>
      </div>
      <button class="btn sub" data-act="addMenu">${R("{足|た}す")}</button>
    </div>
    ${JH ? "" : `    <h2 class="sec" id="rewards">${R("おうちのごほうび")}</h2>
    <div class="panel form">
      <div class="hint">${R("おうちの{人|ひと}といっしょに{決|き}めよう。{条件|じょうけん}をクリアすると、アプリでお{知|し}らせするよ。")}</div>
      ${(S.rewards || []).map(r => { const p = rwProg(r, c), ok = p >= r.target; return `<div class="mrow">
        <div class="t">${esc(r.text)}<small>${R(rwCond(r))}・${r.got ? R("もらった！") : ok ? R("{達成|たっせい}！") : R(`いま ${p.toLocaleString()}`)}</small></div>
        ${ok && !r.got ? `<button class="btn sm" data-act="rwGot" data-v="${r.id}">${R("もらった")}</button>` : ""}
        <button class="del" data-act="delReward" data-v="${r.id}">${R("{消|け}す")}</button></div>`; }).join("")}
      <div class="field"><label for="rw-text">${R("ごほうび")}</label><input id="rw-text" maxlength="40" placeholder="れい：バッティングセンター"></div>
      <div class="row2">
        <div class="field"><label for="rw-type">${R("{条件|じょうけん}")}</label><select id="rw-type">${Object.entries(RW_TYPES).map(([k, t]) => `<option value="${k}">${plain(t.n)}</option>`).join("")}</select></div>
        <div class="field"><label for="rw-target">${R("{目標|もくひょう}の{数|かず}")}</label><input id="rw-target" type="number" inputmode="numeric" min="1" value="10"></div>

`}
    <h2 class="sec" id="backup">${R("{記録|きろく}のバックアップ")}</h2>

    <h2 class="sec">${R("{音|おと}")}</h2>

      <button class="sw ${S.sound !== false ? "on" : ""}" data-act="swSound" aria-label="おと" aria-pressed="${S.sound !== false}"></button></div></div>
    <div class="note">${R("いまの{記録|きろく}は、このスマホの{中|なか}にほぞんされています。")}</div>
  </div>`;
}

/* ---------- 演出 ---------- */
const reduced = () => window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
let ovAt = 0;
function showOv(html, homerun) {
  const o = document.getElementById("ov");
  o.innerHTML = `<div class="box">${homerun ? "" : '<div class="rays"></div>'}${html}<div class="tap">${R("タップでとじる")}</div></div>`;
  o.hidden = false; ovAt = Date.now();
  if (homerun && !reduced()) { const c = document.createElement("canvas"); c.className = "fx"; o.prepend(c); homerunFx(c); }

/* ---------- 練習のおとも（回数カウンター・タイマー） ---------- */
let TS = null, wakeLock = null;
function openTool(id) {
  const m = S.menu.find(x => x.id === id); if (!m) return;
  const L = S.logs[ymd()];
  TS = plain(m.unit) === "分" ? { id, mode: "timer", total: m.count * 60000, left: m.count * 60000, running: false }
                              : { id, mode: "count", n: 0, target: m.count, var: !!m.var };
  if (L && L.done[id] && TS.mode === "count") TS.n = 0;
  document.getElementById("tool").hidden = false; renderTool();
}
function renderTool() {
  const el = document.getElementById("tool");
  if (!TS) { el.hidden = true; el.innerHTML = ""; return; }
  const m = S.menu.find(x => x.id === TS.id); let body;
  if (TS.mode === "count") {
    const goal = TS.n >= TS.target;
    body = `<button class="tap-big ${goal ? "goal" : ""}" data-act="toolTap"><span class="n">${TS.n}</span><span class="of">${R(`/ ${TS.target}${m.unit}`)}</span>
        <span class="hint">${R(goal ? "{目標|もくひょう}{達成|たっせい}！" : "1{回|かい}やるごとにタップ")}</span></button>
      <div class="row2"><button class="btn sub" data-act="toolAdd" data-v="-1">−1</button><button class="btn sub" data-act="toolAdd" data-v="${TS.var ? 10 : 5}">+${TS.var ? 10 : 5}</button></div>
      <button class="btn" data-act="toolDone" ${TS.n < 1 ? "disabled" : ""}>${R(TS.var ? `おわり！${Math.min(m.max, Math.max(10, Math.floor(TS.n / 10) * 10))}{回|かい}でチェック` : "おわり！チェックする")}</button>`;
  } else {
    const C = 2 * Math.PI * 45;
    body = `<div class="timer-face"><svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="45" fill="none" stroke="rgba(255,255,255,.08)" stroke-width="7"/>
        <circle id="tool-ring" cx="50" cy="50" r="45" fill="none" stroke="var(--turf)" stroke-width="7" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="0"/></svg><div class="t" id="tool-t"></div></div>
      ${TS.left <= 0 ? `<div class="big" style="text-align:center;font-family:var(--font-d);font-size:28px;color:var(--turf)">${R("おわり！チェックしたよ")}</div>`
                     : `<button class="btn" data-act="toolStart">${R(TS.running ? "ストップ" : "スタート")}</button>`}
      <div class="row2"><button class="btn sub" data-act="toolReset">${R("リセット")}</button><button class="btn sub" data-act="toolDone">${R("ここでチェック")}</button></div>`;
  }
  el.innerHTML = `<div class="tool-in"><div class="tool-head"><b>${R(m.name)}</b><button class="btn sub sm" style="width:auto" data-act="toolClose">${R("とじる")}</button></div>${body}</div>`;
  if (TS.mode === "timer") toolTick();
}
function toolTick() {
  if (!TS || TS.mode !== "timer") return;
  if (TS.running) TS.left = Math.max(0, TS.endAt - Date.now());
  const s = Math.ceil(TS.left / 1000), t = document.getElementById("tool-t"), ring = document.getElementById("tool-ring");
  if (t) t.textContent = `${Math.floor(s / 60)}:${pad(s % 60)}`;
  if (ring) ring.setAttribute("stroke-dashoffset", String(2 * Math.PI * 45 * (1 - TS.left / TS.total)));
  if (TS.running && TS.left <= 0) {
    TS.running = false; clearInterval(TS.iv); releaseWake();
    beep(880, .25, .3); setTimeout(() => beep(1320, .4, .3), 280);
    markDone(TS.id, null, true); renderTool();

}
async function keepAwake() { try { if (navigator.wakeLock) wakeLock = await navigator.wakeLock.request("screen"); } catch (e) {} }
function releaseWake() { try { wakeLock && wakeLock.release(); } catch (e) {} wakeLock = null; }
// おとものあとでチェックを付ける（素振りは数えた回数を10回きざみで記録）
function markDone(id, count, keepOpen) {
  const m = S.menu.find(x => x.id === id); if (!m) return;
  const L = S.logs[ymd()], done = !!(L && L.done[id]);
